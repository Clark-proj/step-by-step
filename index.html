<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Step by Step</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Step by Step">
<meta name="theme-color" content="#fdfcff">
<style>
/* Mobile app, lavender style. Guides are intact 2D illustrations that move as a whole. */
:root{
  --bg1:#e6dcff;--bg2:#f4efff;--bg3:#ffffff;
  --ink:#1d1830;--mut:#6e6789;--soft:#a39cb8;--line:#ece6f7;--tint:#f7f4fe;
  --v1:#7b5cf0;--v2:#5b3fd6;--vio:#6d4fe0;--vbg:#efe9ff;
  --ok:#2a9a66;--ok-bg:#e8f7ef;--warn:#b8701f;--warn-bg:#fff3e2;
  --f:"Urbanist",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh:0 4px 14px rgba(90,60,180,.07);
  --cta:linear-gradient(180deg,var(--v1),var(--v2));
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 34%,var(--bg3) 78%) fixed;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--vio) 45%,transparent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}p{margin:0}
.app{max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(108px + env(safe-area-inset-bottom,0px))}
/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top .dt{font-size:14px;color:var(--mut);font-weight:500}.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:30px;background:#fff;box-shadow:var(--sh);font-weight:700;font-size:14px;white-space:nowrap}
.lvr{--p:0%;width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--vio) 0 var(--p),#ece7f6 var(--p) 100%);display:grid;place-items:center}.lvr b{width:17px;height:17px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:10.5px;color:var(--vio)}
/* stage: halo + intact figure + particles */
.stage{position:relative;height:var(--h,300px);--aura:0;isolation:isolate}
.halo{position:absolute;left:50%;top:50%;width:min(calc(var(--h,300px)*.96),94%);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-52%);background:radial-gradient(circle at 50% 45%,#efe8ff 0,#e7defb 68%,#e2d7fa 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.halo::after{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent) 0,transparent 66%);opacity:var(--aura);transition:opacity .8s}
.stage[data-base="explain"] .halo::after{animation:aurap 2.4s ease-in-out infinite}
.stage[data-base="focus"] .halo::after{opacity:calc(var(--aura) + .12);inset:6%}
@keyframes aurap{50%{opacity:calc(var(--aura) + .16)}}
.fig{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:var(--fb,5%);height:var(--fh,84%);z-index:1}
.fig::before{content:"";position:absolute;left:12%;right:12%;bottom:-3%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(70,40,140,.22),transparent);z-index:-1}
.shot,.pose,.br{height:100%;transform-origin:50% 100%}
.pose{transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.fig img{height:100%;width:auto;display:block;user-select:none;-webkit-user-drag:none}
.fig.cardf .br{aspect-ratio:940/1011}
.fig.cardf img{width:100%;height:100%;object-fit:cover;border-radius:9%/8.4%;box-shadow:0 14px 30px rgba(50,30,110,.25),0 0 0 3px #fff}
.br{animation:breath 3.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(1.004,1.012) rotate(.8deg)}50%{transform:scale(1,1.002) rotate(0)}75%{transform:scale(1.004,1.012) rotate(-.8deg)}}
.stage[data-base="listen"] .pose{transform:rotate(-3deg)}.stage[data-base="listen"] .br{animation-duration:5s}
.stage[data-base="explain"] .br{animation:rock 2.4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.stage[data-base="focus"] .pose{transform:translateY(1%)}.stage[data-base="focus"] .br{animation:breathf 6s ease-in-out infinite}
@keyframes breathf{50%{transform:scale(1.002,1.008)}}
.pfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.stage.still .br,.rmode .br{animation:none!important}.rmode .halo::after{animation:none!important}
/* guide line */
.line{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:var(--sh);font-size:15.5px;line-height:1.45;color:#3b3550;margin-top:4px}
.line b{color:var(--ink)}.line .nm{font-weight:700;color:var(--vio);margin-right:4px}
/* buttons */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:14px 22px;border-radius:30px;background:var(--cta);color:#fff;font-weight:600;font-size:17px;box-shadow:0 10px 24px rgba(91,63,214,.35);transition:transform .15s}
.cta:active{transform:scale(.98)}.cta[disabled]{opacity:.4;box-shadow:none;cursor:default}
.ghost{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 18px;border-radius:28px;background:#fff;color:var(--vio);font-weight:600;font-size:16px;box-shadow:var(--sh)}
.lnk{color:var(--vio);font-weight:600;font-size:15px;padding:10px 4px;text-decoration:underline;text-underline-offset:3px}
.lnk.mut{color:var(--mut)}.lnk.del{color:#c0384b}
.row2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px;margin-top:12px}
/* segmented filter */
.seg{display:flex;background:#fff;border-radius:30px;padding:4px;gap:2px;box-shadow:var(--sh)}
.seg button{flex:1;padding:9px 4px;border-radius:24px;font-weight:600;font-size:14.5px;color:var(--mut)}
.seg button[aria-selected="true"]{background:var(--cta);color:#fff;box-shadow:0 4px 12px rgba(91,63,214,.3)}
.seg i{font-style:normal;font-size:12px;opacity:.8;margin-left:3px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}.sec b{font-size:19px;font-weight:700}.sec span{font-size:13.5px;color:var(--mut)}
/* habit rows */
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.hr{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 12px 10px 10px;box-shadow:var(--sh);min-height:72px}
.hr .ht{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:12px}
.th{width:52px;height:56px;flex:none;border-radius:14px;background:#e9e2fb center/cover no-repeat;box-shadow:0 0 0 2px #fff,0 3px 8px rgba(60,30,120,.16)}
.hr b{display:block;font-size:16.5px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr small{display:block;font-size:13.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{display:flex;gap:3px;margin-top:6px}.bd i{width:16px;height:4px;border-radius:2px;background:#ece7f6}.bd i.on{background:var(--c)}
.ck{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid #d9d1ee;display:grid;place-items:center;color:transparent;font-size:19px;font-weight:700;transition:background .2s,border-color .2s}
.ck[aria-pressed="true"]{background:var(--c,var(--vio));border-color:var(--c,var(--vio));color:#fff}
.ck.p{border-style:dashed;color:var(--soft);font-size:15px}
.ck[disabled]{opacity:.45;cursor:default}
.hr.dn b{color:var(--soft);text-decoration:line-through}.hr.busy{opacity:.6}
.big{padding:14px;gap:14px}.big .th{width:66px;height:72px}.big b{font-size:19px;white-space:normal}
.then{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:14px 4px 0}
.empty{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh);color:var(--mut);font-size:15.5px;text-align:center}
/* week */
.wk{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wd{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:start;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:var(--sh)}
.wd.on{box-shadow:0 0 0 2px var(--vio),var(--sh)}.wd.past{opacity:.75}
.wd .dl{font-size:13px;color:var(--mut);font-weight:600;line-height:1.1}.wd .dl b{display:block;font-size:22px;color:var(--ink);font-weight:600}
.wq{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#fff);font-size:13px;font-weight:600;border-left:3px solid var(--c)}
.tg.dn{text-decoration:line-through;color:var(--soft)}.tg.bz{background:#f1eef6;border-left-color:#cfc8dc;color:var(--mut)}
.wsum{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin:12px 4px 0}.wsum b{color:var(--ink)}
/* tab bar */
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(90,60,180,.08)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--soft);padding:4px 0;min-height:48px;justify-content:center}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--vio)}
.tabs .plus{position:relative;top:-14px}
.tabs .plus span{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#8ff7ff,#00e5ff 22%,#8a5bff 62%,#ff3ec8);box-shadow:0 0 0 4px #fff,0 0 22px rgba(0,229,255,.55),0 0 40px rgba(155,91,255,.45);animation:neon 2.6s ease-in-out infinite}
.tabs .plus span svg{width:28px;height:28px;color:#fff}
@keyframes neon{50%{box-shadow:0 0 0 4px #fff,0 0 28px rgba(255,62,200,.55),0 0 50px rgba(0,229,255,.5)}}
/* overlays */
.ov{position:fixed;inset:0;z-index:60;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 34%,var(--bg3) 78%);animation:fin .25s ease-out}
@keyframes fin{from{opacity:0}}
.ovin{max-width:480px;min-height:100%;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.nav{display:flex;align-items:center;gap:14px;min-height:52px}
.back{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh);flex:none}.back svg{width:20px;height:20px}
.prog{flex:1;height:6px;border-radius:4px;background:#fff;overflow:hidden}.prog i{display:block;height:100%;border-radius:4px;background:var(--vio);transition:width .35s}
.kick{text-align:center;color:var(--vio);font-weight:600;font-size:17px;margin-top:6px}
.foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
/* onboarding */
.q{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:14px 2px 6px}
.qs{color:var(--mut);font-size:15.5px;margin:0 2px 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.g2{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);border:2px solid transparent;min-height:64px}
.opt .ic{width:42px;height:42px;flex:none;border-radius:50%;background:var(--vbg);display:grid;place-items:center;color:var(--vio)}.opt .ic svg{width:22px;height:22px}
.opt b{display:block;font-size:16px;font-weight:700}.opt small{display:block;font-size:13px;color:var(--mut);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--vio);background:#fbf9ff}
.opt .tk{margin-left:auto;width:24px;height:24px;flex:none;border-radius:50%;border:2px solid #ddd5f0;display:grid;place-items:center;font-size:13px;color:transparent}
.opt[aria-pressed="true"] .tk{background:var(--vio);border-color:var(--vio);color:#fff}
.opts.g2 .opt{flex-direction:column;align-items:flex-start;gap:6px;min-height:0;padding:12px}.opts.g2 .opt .tk{position:absolute;top:10px;right:10px}.opts.g2 .opt{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 15px;border-radius:24px;background:#fff;box-shadow:var(--sh);font-weight:600;font-size:15px;border:2px solid transparent;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--vio);color:var(--vio);background:#fbf9ff}
.lb{font-size:14px;font-weight:700;color:var(--mut);margin:18px 2px 8px}
.days{display:flex;gap:6px;justify-content:space-between}.days button{flex:1;max-width:48px;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:var(--sh);font-weight:700;border:2px solid transparent}.days button[aria-pressed="true"]{background:var(--vio);color:#fff}
.addc{display:flex;gap:6px;margin-top:10px}.addc input,.addc select{font:inherit;font-size:16px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);min-width:0}.addc input{flex:1}
.known{margin-top:16px;background:rgba(255,255,255,.65);border-radius:16px;padding:10px 14px;font-size:13.5px;color:var(--mut)}.known b{color:var(--ink);font-weight:600}
/* welcome */
.trio{position:relative;height:300px;margin-top:10px}
.trio>.s0,.trio>.s1,.trio>.s2{position:absolute;bottom:0;width:58%}.trio .s0{left:-6%;z-index:1}.trio .s1{left:21%;z-index:2}.trio .s2{right:-6%;z-index:1}
.trio .halo{display:none}.trio .bigh{position:absolute;left:50%;top:46%;width:300px;height:300px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 50% 45%,#efe8ff 0,#e7defb 68%,#e2d7fa 100%)}
.wt{font-size:31px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-align:center;margin-top:8px}
.ws{text-align:center;color:var(--mut);font-size:16px;margin-top:8px}
/* proposal */
.pt{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:10px 2px 4px}
.ps{color:var(--mut);font-size:15px;margin:0 2px}
.tbar{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);margin-top:12px}
.tbar .r{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}.tbar .r b{color:var(--ink);font-size:16px}
.bars{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#f1edf8;margin-top:8px}.bars i{display:block;height:100%}
.pr{background:#fff;border-radius:20px;padding:12px;box-shadow:var(--sh)}
.pr .tp{display:flex;gap:12px;align-items:center}.pr .tp div{flex:1;min-width:0}.pr b{display:block;font-size:16.5px;font-weight:700}.pr small{display:block;font-size:13.5px;color:var(--mut)}
.pv{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;font-size:14px;color:var(--mut)}.pv b{display:inline;font-size:15px;color:var(--ink)}
.pd{display:flex;gap:4px;margin-top:10px}.pd i,.pd button{flex:1;max-width:36px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:#f4f1fa;color:#b4adc4}.pd .on{background:var(--c);color:#fff}
.int{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px}.int.leggera{background:var(--ok-bg);color:var(--ok)}.int.media{background:var(--warn-bg);color:var(--warn)}.int.alta{background:#ffe7ea;color:#c0384b}
.stp{display:inline-flex;align-items:center;gap:6px;background:#f6f3fc;border-radius:20px;padding:3px}.stp button{width:34px;height:34px;border-radius:50%;background:#fff;font-weight:700;font-size:18px;box-shadow:0 1px 3px rgba(60,30,120,.12)}.stp b{min-width:42px;text-align:center}
.why{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--sh);margin-top:12px}.why h3{font-size:17px;font-weight:700}.why ul{margin:8px 0 0;padding-left:18px;font-size:15px;line-height:1.45;color:#3b3550}.why li{margin-bottom:6px}.why li b{color:var(--ink)}
.rm{margin-left:auto;color:var(--soft);font-size:14px;padding:8px}
/* guide intro */
.gname{text-align:center;font-size:32px;font-weight:800;color:var(--vio);letter-spacing:-.01em;margin-top:2px}
.gfield{text-align:center;color:var(--mut);font-size:15.5px;margin-top:-2px}
.ghead{text-align:center;font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:10px}
.gtip{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-top:14px;border:1px solid #f0ebfa}
.gtip .ic{width:48px;height:48px;flex:none;border-radius:50%;background:var(--vbg);display:grid;place-items:center;color:var(--vio)}.gtip .ic svg{width:24px;height:24px}
.gtip p{font-size:15.5px;line-height:1.4;color:#3b3550}
/* sheet */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(40,25,80,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fin .2s}
.sheet{width:min(480px,100%);max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#f1ebff 0,#fff 46%);border-radius:28px 28px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:#d9d0ee;margin:4px auto 6px}
.sx{display:flex;justify-content:flex-end}.xb{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:15px}
.sh2{font-size:25px;font-weight:700;letter-spacing:-.02em;text-align:center}
.smeta{text-align:center;color:var(--mut);font-size:14.5px;margin-top:2px}
.acts3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:14px}
.acts3 .cta{min-height:52px;font-size:16px}.acts3 .ghost{min-height:52px;font-size:15px;padding:10px}
.choice{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh);margin-top:10px}.choice p{font-size:15px;color:var(--mut);margin:2px 4px 8px}.choice .chips{gap:6px}
.blk{background:#fff;border-radius:18px;padding:13px 15px;box-shadow:var(--sh);margin-top:12px}
.kc{font-size:12px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#2a2040)}
.blk p{margin-top:4px;font-size:15px;color:#3b3550}
.trk{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}.trk div{text-align:center;font-size:10.5px;font-weight:700;color:var(--soft)}.trk i{display:block;height:6px;border-radius:3px;background:#ece7f6;margin-bottom:4px}.trk .on{color:color-mix(in srgb,var(--c) 70%,#2a2040)}.trk .on i{background:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stats div{background:var(--tint);border-radius:14px;padding:8px 4px;text-align:center}.stats b{display:block;font-size:20px}.stats small{font-size:12px;color:var(--mut)}
.hm{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:10px}.hm i{display:block;aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,#fff)}.hm i.f{background:var(--c)}.hm i.m{background:color-mix(in srgb,var(--c) 55%,#fff)}.hm i.n{background:#f5f2fa}
.bar{height:8px;border-radius:5px;background:#f1edf8;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:5px;background:var(--c)}

const SPORT=/calc|palestr|cors|nuot|tennis|padel|yoga|pilates|bici|basket|pallavol|danza|arrampic|allenament|sport|crossfit/i;
function genPlan(p,variant){const why=[];const cur=new Set(p.current||[]);const goals=(p.goals||[]).slice(0,3);
  const budget=Math.round((p.weekly||240)*({leggero:.5,consigliato:.95,ambizioso:1.35}[variant]));

  const per=variant==="ambizioso"?2:1;
  for(const g of goals){let n=0;for(const k of (GOALS[g]||[,[]])[1]){if(picks.length>=maxN||n>=per)break;if(cur.has(k)||picks.includes(k))continue;picks.push(k);n++}}
  if(variant!=="leggero"&&p.eve==="bassa"&&picks.length<maxN&&!picks.includes("respiro")&&!cur.has("respiro")&&(p.hours||0)>=35)picks.push("respiro");

  if(variant!=="leggero"){const est=()=>picks.reduce((a,k)=>a+HC[k].m*HC[k].f,0);for(const g of goals){for(const k of (GOALS[g]||[,[]])[1]){if(picks.length>=maxN||est()+HC[k].m*HC[k].f>budget*1.05)break;if(cur.has(k)||picks.includes(k))continue;picks.push(k);break}}}

const pickDays=(pat,f)=>{f=Math.max(1,Math.min(pat.length,f));if(f===pat.length)return pat.slice();const t=wd(new Date());let k=pat.findIndex(x=>x>=t);if(k<0)k=0;const r=pat.slice(k).concat(pat.slice(0,k));const step=r.length/f;const out=[];for(let i=0;i<f;i++)out.push(r[Math.floor(i*step)]);return [...new Set(out)].sort((a,b)=>a-b)};

  let g=0;while(tot()>T&&g++<400){const big=T2.slice().sort((a,b)=>b.m*b.f-a.m*a.f)[0];if(!big)break;
    if(big.f>1&&(big.f>2||big.m<=5))big.f--;else if(big.m>5)big.m-=5;else{const c=T2.filter(x=>x.f>1).sort((a,b)=>b.f-a.f)[0];if(c)c.f--;else break}}
  g=0;while(g++<400){const c=T2.slice().sort((a,b)=>a.m/ACT[a.id].m-b.m/ACT[b.id].m)[0];if(!c)break;if(c.f<D&&kind!=="scintilla"&&tot()+c.m<=T){c.f++;continue}if(c.m+5<=ACT[c.id].m*P.mx&&tot()+5*c.f<=T){c.m+=5;continue}break}

 {n:"Orizzonte",acts:4,min:40,days:5,win:14,need:12,d:"Le abitudini reggono da sole: spazio a una nuova area.",img:"percorso_orizzonte.webp"}];

function pathStats(){const pc=meta().percorso||{};const tS=today();const created=H().map(([,h])=>h.created).filter(Boolean).sort();const start=[pc.start,created[0]].filter(Boolean).sort()[0]||tS;
  const span=Math.min(84,Math.max(1,daysBetween(start,tS)+1));const D=[];for(let i=span-1;i>=0;i--){const ds=iso(addD(new Date(),-i));const L=dayList(ds);let dn=0,mi=0;for(const [id] of L){const c=chk(ds,id);if(doneV(c)){dn++;if(c.v==="m")mi++}}D.push({ds,sc:L.length,dn,mi,w:wd(parse(ds)),L})}
  let cur=0;for(let i=D.length-1;i>=0;i--){const d=D[i];if(!d.sc)continue;if(d.dn){cur++;continue}if(d.ds===tS)continue;break}
  let best=0,run=0;for(const d of D){if(!d.sc)continue;if(d.dn){run++;best=Math.max(best,run)}else if(d.ds!==tS)run=0}
  const act30=D.slice(-30).filter(d=>d.dn).length;const tot=D.reduce((s,d)=>s+d.sc,0),dn=D.reduce((s,d)=>s+d.dn,0),mi=D.reduce((s,d)=>s+d.mi,0);
  const wk=[0,0,0,0,0,0,0].map(()=>({sc:0,dn:0}));const mo={mattina:{sc:0,dn:0},pranzo:{sc:0,dn:0},pomeriggio:{sc:0,dn:0},sera:{sc:0,dn:0}};const ar={};
  for(const d of D){wk[d.w].sc+=d.sc;wk[d.w].dn+=d.dn;for(const [id,h] of d.L){const m=mo[h.when||"mattina"];m.sc++;const ok=doneV(chk(d.ds,id));if(ok)m.dn++;const f=figOf(h.guide);ar[f]=ar[f]||{sc:0,dn:0};ar[f].sc++;if(ok)ar[f].dn++}}
  const weeks=[];const mon=addD(new Date(),-wd(new Date()));for(let k=7;k>=0;k--){let sc=0,d2=0;for(let i=0;i<7;i++){const ds=iso(addD(mon,i-7*k));const x=D.find(z=>z.ds===ds);if(x){sc+=x.sc;d2+=x.dn}}weeks.push({k,sc,dn:d2})}
  return {start,D,cur,best,act30,tot,dn,mi,wk,mo,ar,weeks}}

    return `<div class="wd5 ${ds===tS?"tdy":""} ${ds<tS?"past":""}"><button class="wd5d" data-cdayg="${ds}" aria-label="Apri ${GIORNI[dd.getDay()]} ${dd.getDate()}"><small>${WDL[i]}</small><b>${dd.getDate()}</b></button><div class="wd5c">${chips||`<span class="wd5e">giorno libero</span>`}</div></div>`}).join("");
  return `<div class="wg5"><div class="wg5n"><button class="rb3" data-cweek="-7" aria-label="Settimana precedente">${icon("back",1.8)}</button><b>${parse(days[0]).getDate()} – ${parse(days[6]).getDate()} ${MESI[parse(days[6]).getMonth()]}</b><button class="rb3 nx" data-cweek="7" aria-label="Settimana successiva">${icon("back",1.8)}</button></div>
   <div class="wl5">${cards}</div><p class="wg5s"><span>Fatte <b>${dn} di ${tot}</b></span><span><b>${durH(mins)}</b> dedicati</span></p></div>`}
function tappaRing(cur,cp){const R=40,C=52,N=5,gap=12,seg=(360-N*gap)/N;const pt=a=>{const r=(a-90)*Math.PI/180;return [C+R*Math.cos(r),C+R*Math.sin(r)]};
  const arc=(a0,a1)=>{const [x0,y0]=pt(a0),[x1,y1]=pt(a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`};let s="";
  for(let i=0;i<N;i++){const a0=i*(seg+gap)+gap/2;s+=`<path d="${arc(a0,a0+seg)}" class="rb"/>`;const fr=i<cur?1:i===cur?Math.max(.05,cp):0;if(fr>0)s+=`<path d="${arc(a0,a0+seg*fr)}" class="rf ${i===cur?"now":""}"/>`}
  return `<svg viewBox="0 0 104 104" aria-hidden="true">${s}</svg>`}
function tappaCardHome(){const pc=meta().percorso;if(!pc||pc.tappa==null)return "";const T=TAPPE[pc.tappa];const tS=today();let done=0;
  for(let i=0;i<T.win;i++){const ds=iso(addD(parse(pc.start),i));if(ds>tS)break;for(const k in S.checks)if(k.startsWith(ds+"__")&&doneV(S.checks[k])){done++;break}}
  const left=Math.max(0,T.need-done);const cp=Math.min(1,done/T.need);
  return `<button class="o5home t5" data-path aria-label="Apri le statistiche del percorso"><div class="t5r">${tappaRing(pc.tappa,cp)}<span class="t5c"><b>${pc.tappa+1}</b><small>di 5</small></span></div><div class="t5t"><span class="t5k">Il tuo percorso</span><b>${T.n}</b><span class="t5n">${TAPPE.map((x,i)=>`<i class="${i<pc.tappa?"ok":i===pc.tappa?"on":""}" title="${x.n}"></i>`).join("")}</span><p>${done} di ${T.need} giorni fatti · ${TAPPE[pc.tappa+1]?(left?`ancora ${left} per ${TAPPE[pc.tappa+1].n}`:`pronto per ${TAPPE[pc.tappa+1].n}`):"ultima tappa"}</p></div><span class="t5go">${icon("l3chev",1.5)}</span></button>`}

const TIPS={"Brook":[{"S":["Prepara le scarpe vicino alla porta: il corpo segue ciò che vede.","Lascia una bottiglia d'acqua sulla scrivania: bere diventa automatico.","Scegli un percorso fisso per camminare: niente decisioni, solo passi.","Lega il movimento a un gesto quotidiano: dopo il caffè, due minuti di stretching.","Tieni il tappetino già steso: togliere un ostacolo vale più di mille propositi."],"C":["Due minuti di movimento oggi tengono acceso il corpo per domani.","Non serve sudare per cominciare: serve muoversi, anche poco.","Fermati prima di stancarti: il corpo ricorda il piacere, non la fatica.","Ogni volta che ti muovi dici al corpo che ti prendi cura di lui.","In questa tappa conta presentarsi, non la prestazione."],"R":["Saltato un giorno? Fai solo due minuti di mobilità: il fiume riprende a scorrere.","Ripartire dopo una pausa: la versione mini è il punto giusto.","Se il corpo è stanco, cammina invece di correre: conta lo stesso.","Un giorno fermo non cancella i progressi: muoviti oggi.","Dopo un malanno riparti piano: il corpo ha la sua memoria."],"M":["Il mattino è il momento migliore per muoversi: nessuno ti ha ancora rubato tempo.","Una camminata dopo pranzo aiuta la digestione e la concentrazione.","Bevi un bicchiere d'acqua appena sveglio: è il primo gesto per il corpo.","Muoviti prima di sederti al lavoro: la mente parte più sveglia.","La sera prediligi movimenti dolci: stretching e respiro."]},{"S":["Due gesti fissi: un bicchiere d'acqua e cinque minuti di movimento.","Prepara la borsa la sera prima: la mattina esci senza pensarci.","Scegli due giorni fissi per l'attività più intensa: il resto è leggero.","Tieni un piccolo spazio libero in casa per muoverti senza spostare niente.","Usa una sveglia sul telefono per ricordarti di alzarti dalla sedia."],"C":["La radice del corpo è la regolarità: meglio poco ogni giorno che tanto ogni tanto.","Anche nelle giornate piene, cinque minuti di movimento tengono vivo il ritmo.","Il corpo si adatta lentamente: fidati delle settimane, non dei giorni.","Ogni ripetizione rafforza il gesto: tra un mese ti sembrerà naturale.","Ascolta il corpo: la costanza non è ignorare i segnali."],"R":["Hai perso il ritmo? Riprendi dai due gesti più facili.","Se un'attività ti pesa, cambiala con una che ti piace di più.","Dopo una settimana ferma, ricomincia con metà del tempo.","Il corpo non ti giudica: riparte appena gli dai occasione.","Un dolore va ascoltato: fai mobilità dolce e riprendi quando passa."],"M":["Muoversi alla stessa ora aiuta il corpo a prepararsi da solo.","Prima di cena è un buon momento per l'attività più intensa.","Una pausa di movimento ogni ora rende il lavoro meno pesante.","Cucina il pasto il giorno prima nelle giornate più cariche.","Lo stretching prima di dormire scioglie le tensioni della giornata."]},{"S":["Piano B: se salta l'allenamento, fai venti minuti di camminata svelta.","Alterna giorni intensi e giorni leggeri: il corpo cresce nel recupero.","Prepara i pasti della settimana in un'unica sessione.","Tieni un registro semplice: cosa hai fatto, come ti sei sentito.","Trova un percorso alternativo per i giorni di pioggia."],"C":["Il flusso arriva quando il movimento diventa una parte della giornata, non un extra.","Tre attività per il corpo si aiutano: dormire bene aiuta l'allenamento.","Se la settimana è piena, fai le versioni corte ma non saltare.","La costanza si vede nell'energia che hai, prima che nello specchio.","Celebra le piccole conquiste: un piano in più, un minuto in più."],"R":["Il piano B è fatto per i giorni come oggi: usalo.","Hai saltato giorni di allenamento? Il primo è di ripresa, non di recupero.","Se l'energia è bassa, scegli il movimento più gentile.","Una cena pesante non cancella niente: domani torna il ritmo.","Torna a una sola attività finché il flusso non riparte."],"M":["Allenarsi al mattino libera la giornata dal pensiero di farlo.","Mangia qualcosa di leggero un'ora prima di muoverti.","Il recupero è parte del flusso: dormi abbastanza nei giorni intensi.","Una passeggiata nella natura nel fine settimana ricarica corpo e mente.","Bevi durante tutta la giornata, non tutto insieme la sera."]},{"S":["Ogni settimana rivedi il tuo piano: aggiungi solo dove senti margine.","Pianifica una settimana di scarico ogni mese: lo slancio ha bisogno di respiro.","Trova un compagno di movimento: lo slancio si moltiplica insieme.","Tieni l'attrezzatura pronta e pulita: nessuna scusa logistica.","Alterna attività diverse per non annoiarti e non sovraccaricare."],"C":["Quattro attività sono tante: alleggerisci quella che pesa, non tutto.","Lo slancio si mantiene con il margine, non con la fatica.","Quando vai forte, non aggiungere carico: consolida.","La costanza è diventata energia: la senti nelle giornate lunghe.","Ascolta il riposo con la stessa attenzione con cui ascolti l'allenamento."],"R":["Se lo slancio cala, torna per una settimana alla tappa precedente.","Dopo un infortunio, riparti dalla mobilità e dalla camminata.","Un periodo di stress chiede movimento leggero, non zero.","Rimanda con un giorno preciso: il corpo ama sapere quando.","Chiediti cosa ti ha fermato e togli quell'ostacolo."],"M":["I giorni più pieni chiedono movimento breve e intenso.","Il fine settimana è ideale per l'uscita lunga.","Fai il punto a fine mese: come dormi, come mangi, come ti muovi.","Dopo un periodo intenso concediti giorni di recupero attivo.","Cambia stagione, cambia attività: il corpo ama la varietà."]},{"S":["Il movimento ormai va da solo: prova uno sport nuovo.","Scrivi la tua routine ideale: ti servirà nei periodi di cambiamento.","Ogni stagione rivedi le abitudini del corpo: aggiusta, non stravolgere.","Condividi la tua esperienza: aiutare gli altri rafforza il tuo ritmo.","Tieni sempre una versione mini: anche il corpo allenato ha giornate no."],"C":["Il tuo corpo ha imparato a muoversi: proteggi questo ritmo.","Guarda quanto è cambiata la tua energia dall'inizio del percorso.","La salute è un'abitudine lunga: continua a nutrirla.","La base solida ti permette un obiettivo nuovo: una gara, un cammino.","Rinnova il motivo per cui ti muovi: cambia nel tempo."],"R":["Anche all'orizzonte capitano settimane ferme: riparti da una camminata.","Dopo un periodo difficile, torna alla scintilla: due minuti.","Un cambio di vita sconvolge gli orari: ancora il movimento a un gesto nuovo.","Il corpo ricorda: la ripresa sarà più veloce di quanto pensi.","Le vacanze sono occasione di movimento diverso, non di pausa totale."],"M":["Usa le giornate lunghe d'estate per muoverti all'aperto.","In inverno porta il movimento in casa senza perdere il ritmo.","Un giorno al mese dedicato a una lunga uscita nella natura.","Il momento giusto per una sfida nuova è quando le basi reggono.","Ogni anno scegli un obiettivo che ti emozioni."]}],"Ember":[{"S":["Decidi un solo posto dove inizi a lavorare: la scrivania diventa il segnale di partenza.","Lascia il primo passo già pronto la sera prima, così domani non devi scegliere.","Scrivi su un foglio la cosa da fare e mettilo dove lo vedi appena ti siedi.","Collega l'attività a un gesto che fai già: dopo il caffè, si apre il lavoro.","Tieni un solo strumento per segnare cosa fai: meno posti da controllare, meno attrito."],"C":["Basta accendere la scintilla: cinque minuti oggi valgono più di un'ora rimandata.","Non serve la voglia per cominciare: la voglia arriva dopo i primi due minuti.","Fermati quando è ancora facile: domani ripartirai più volentieri.","Conta le volte, non le ore: in questa tappa vince chi si presenta.","Una cosa piccola fatta ogni volta costruisce più fiducia di una grande fatta una volta."],"R":["Saltato un giorno? Il fuoco non si è spento: oggi fai solo la versione mini.","Ripartire è parte dell'abitudine, non un fallimento: riprendi da dove sei.","Se ieri non è andata, oggi abbassa l'asticella e accendi comunque.","Due giorni di fila saltati sono il segnale: torna subito alla versione più piccola.","Non recuperare il tempo perso: fai solo la tappa di oggi."],"M":["La mattina presto la testa è più libera: è il momento migliore per la cosa difficile.","Se il pomeriggio cala l'energia, tieni lì solo il gesto più leggero.","Inizia prima di aprire le email: l'attenzione degli altri può aspettare dieci minuti.","Chiudi la giornata segnando cosa farai domani: la mattina partirai già orientato.","Scegli un orario e proteggilo come un appuntamento con qualcuno che stimi."]},{"S":["Lega i due gesti uno all'altro: finito il primo, il secondo parte da solo.","Dai a ogni gesto lo stesso posto e lo stesso orario: la ripetizione fa il resto.","Prepara una lista di tre priorità la sera: la mattina scegli solo la prima.","Usa un timer visibile: la radice cresce quando il tempo ha confini chiari.","Tieni sul tavolo solo ciò che serve al compito: il resto è rumore."],"C":["La radice cresce sotto terra: non vedi i risultati, ma stai costruendo.","Due gesti fissi ogni giorno valgono più di cinque fatti a caso.","Se un giorno hai poco tempo, fai i due gesti in versione mini, ma falli.","Guarda la catena di giorni: ogni anello rende più facile il successivo.","La costanza nasce dal momento fisso, non dalla forza di volontà."],"R":["Hai perso il ritmo? Torna all'ancora: stesso orario, stesso posto, gesto piccolo.","Una settimana storta non cancella le radici: riprendi dal primo gesto.","Se un gesto non attecchisce, spostalo in un momento più tranquillo della giornata.","Ricominciare dal mini non è tornare indietro: è tenere viva la radice.","Annota cosa ti ha fermato: spesso basta togliere un ostacolo per ripartire."],"M":["Il momento fisso migliore è subito dopo una routine che non salti mai.","Prima della pausa pranzo c'è spesso un'ora di energia pulita: usala.","Se lavori meglio la sera, rispetta il tuo ritmo e ancora lì i gesti.","L'inizio della settimana è il momento giusto per sistemare la tua lista.","Il venerdì pomeriggio chiudi i fili aperti: il lunedì ringrazierà."]},{"S":["Prepara il piano B: se salta la sessione lunga, sai già quale versione corta fare.","Raggruppa i compiti simili: email insieme, chiamate insieme, lavoro profondo da solo.","Blocca nel calendario il lavoro profondo prima che lo riempiano gli altri.","Chiudi ogni sessione scrivendo il prossimo passo: riprenderai senza attrito.","Tre attività in flusso hanno bisogno di un ordine: decidi quale viene prima."],"C":["Il flusso nasce dalla ripetizione: ogni sessione rende la successiva più fluida.","Non inseguire la giornata perfetta: insegui la giornata in cui ti presenti.","Se la settimana è piena, tieni il ritmo con le versioni corte: il filo non si spezza.","La costanza al lavoro si vede nei mesi, non nei giorni: continua.","Proteggi il ritmo anche quando va bene: è lì che si rischia di mollare."],"R":["Il piano B esiste proprio per oggi: usalo senza sensi di colpa.","Hai saltato una sessione? Non raddoppiare domani: riprendi la misura normale.","Se il flusso si inceppa, torna a una sola attività finché non riparte.","Una giornata caotica è un giorno, non una tendenza: domani si torna al piano.","Riparti dalla cosa più semplice della lista: il movimento crea movimento."],"M":["Le prime due ore dopo l'inizio sono il cuore del flusso: niente notifiche.","Dopo pranzo dedica il tempo ai compiti leggeri: chiamate, ordine, email.","Una pausa vera ogni novanta minuti tiene alta la qualità del flusso.","Fissa un orario di fine: il flusso regge meglio quando ha un confine.","Il lunedì mattina scegli le tre cose che renderanno buona la settimana."]},{"S":["Ogni settimana rivedi cosa ha funzionato: il sistema migliora solo se lo guardi.","Dai a ogni attività un margine: lo slancio regge se non riempi ogni minuto.","Delega o elimina una cosa a settimana: lo spazio liberato alimenta lo slancio.","Tieni un documento unico dei progetti: una sola fonte di verità.","Prepara la settimana la domenica sera in dieci minuti: il resto scorre."],"C":["Lo slancio è energia accumulata: ogni giorno che ti presenti la aumenta.","Quattro attività sono tante: se una pesa, alleggeriscila invece di saltarla.","Misura la costanza sulla settimana, non sul singolo giorno.","Quando tutto va bene, resisti alla tentazione di aggiungere: consolida.","Il margine è il tuo alleato: lascia spazio agli imprevisti senza rompere il ritmo."],"R":["Se lo slancio rallenta, torna per una settimana alla tappa precedente: è una scelta saggia.","Un periodo di carico fuori misura richiede un piano ridotto, non uno stop.","Dopo una pausa lunga riparti dalle due attività più forti.","Rimandare con un giorno preciso è diverso da lasciar perdere: scegli il giorno.","Chiediti cosa ha reso difficile la settimana e cambia una sola cosa."],"M":["Metti il compito più importante dove la tua energia è più alta, sempre.","Gli ultimi venti minuti della giornata servono a chiudere, non a iniziare.","Una mattina a settimana senza riunioni vale oro per i progetti lunghi.","Fai il punto a metà settimana: correggere il mercoledì è più facile che il venerdì.","Dopo una scadenza importante concediti un giorno più leggero: fa parte del ritmo."]},{"S":["Le abitudini ormai reggono: usa questo spazio per una nuova area della tua vita.","Scrivi come funziona la tua giornata di lavoro: è il manuale del tuo sistema.","Ogni trimestre togli un'abitudine che non serve più: il sistema resta leggero.","Insegna a qualcuno il tuo metodo: spiegarlo lo rende più solido.","Tieni le versioni mini sempre pronte: anche all'orizzonte arrivano le giornate storte."],"C":["All'orizzonte la costanza non si sente più come uno sforzo: è il tuo modo di lavorare.","Celebra quanto hai costruito: rileggi le prime settimane e guarda la distanza.","Le abitudini automatiche vanno comunque nutrite: ogni tanto rinnova il perché.","La costanza di oggi è il terreno su cui coltivare un obiettivo più grande.","Non abbassare la guardia nei periodi facili: è lì che le abitudini si allentano."],"R":["Anche chi è all'orizzonte salta dei giorni: riprendi senza drammi.","Se un cambio di lavoro sconvolge tutto, ricostruisci dal momento fisso.","Un'abitudine che si spegne si riaccende in fretta: ricomincia dalla scintilla.","Dopo le vacanze concediti una settimana di versioni mini per ripartire.","Il tuo sistema ha già superato altre tempeste: fidati di lui."],"M":["Usa il momento più calmo della settimana per pensare in grande.","Alla fine del mese guarda i numeri dell'area: dicono dove andare.","Una passeggiata dopo una sessione intensa ricarica più di un'altra tazza di caffè.","Il momento giusto per un nuovo obiettivo è quando le basi vanno da sole: cioè ora.","Ogni anno ripensa a cosa vuoi dal tuo lavoro: le abitudini seguono la direzione."]}],"Hearth":[{"S":["Scegli una persona a cui scrivere questa settimana e mettila in cima ai contatti.","Lega un messaggio premuroso a un gesto: dopo il caffè del mattino, un saluto.","Tieni una lista di persone che vuoi sentire più spesso.","Lascia il telefono lontano durante i pasti con gli altri.","Prepara una domanda da fare: ascoltare è più facile con una curiosità pronta."],"C":["Un messaggio di due righe oggi tiene acceso un legame per settimane.","Non serve un grande gesto: basta far sapere che pensi a qualcuno.","Ogni contatto piccolo costruisce fiducia, uno alla volta.","In questa tappa conta il gesto, non la risposta che ricevi.","Ascoltare cinque minuti senza distrazioni vale più di un'ora distratta."],"R":["Non hai scritto a nessuno? Fallo adesso, anche solo un saluto.","Un legame trascurato si riaccende con un messaggio sincero.","Se ti senti a disagio a riprendere un contatto, inizia con un ricordo comune.","Una giornata chiusa in te stesso capita: domani apri una porta.","Non c'è bisogno di scusarsi a lungo: basta tornare."],"M":["Il messaggio del mattino accompagna la giornata dell'altro.","La cena è il momento naturale per stare insieme davvero.","Una telefonata durante una passeggiata unisce due cose belle.","Il fine settimana è adatto agli incontri: proponili in settimana.","Scrivi a qualcuno quando ti viene in mente: quel momento è il segnale."]},{"S":["Due gesti fissi: un messaggio al giorno e una chiamata a settimana.","Scegli un giorno fisso per sentire una persona cara.","Prepara un piccolo calendario di compleanni e ricorrenze.","Lega il tempo insieme a un rito: la colazione della domenica, la passeggiata serale.","Tieni a portata un biglietto per un pensiero scritto a mano."],"C":["La radice dei legami è la presenza ripetuta.","Anche nelle settimane piene, un messaggio tiene il filo.","I legami crescono lentamente: fidati dei mesi.","Ogni volta che ascolti, l'altro si sente visto.","La gratitudine detta ad alta voce rafforza il legame più di quella pensata."],"R":["Hai perso il ritmo? Riprendi dalla persona a cui tieni di più.","Un silenzio lungo si rompe con semplicità: 'Pensavo a te'.","Se un incontro salta, proponi subito un'altra data.","Dopo un litigio, il primo passo piccolo è il più importante.","Non serve recuperare tutto: riprendi da un contatto."],"M":["Il dopocena è il momento di stare insieme senza fretta.","Chiama chi è lontano quando il fuso orario è comodo per entrambi.","Il sabato mattina è perfetto per organizzare un incontro.","Esprimi gratitudine prima di dormire, anche solo in un messaggio.","Un pranzo insieme spezza la settimana di lavoro."]},{"S":["Piano B: se non riesci a vederti, fai una chiamata di dieci minuti.","Organizza incontri ricorrenti: stessa sera, stesso posto.","Tieni una nota di cose da raccontare o chiedere alle persone care.","Alterna incontri di gruppo e momenti a due.","Proponi attività insieme: cucinare, camminare, giocare."],"C":["Il flusso dei legami nasce dalla regolarità degli incontri.","Tre attività di relazione si sostengono: ascoltare migliora le chiamate.","Se la settimana è piena, tieni almeno un gesto per una persona.","La costanza nei legami si sente quando qualcuno ti cerca per primo.","Celebra i piccoli risultati insieme: rafforzano il legame."],"R":["Il piano B è fatto per i giorni come oggi.","Hai mancato un appuntamento? Scusati e proponi una data subito.","Se un legame si è raffreddato, ricordagli un momento bello.","Una settimana isolata capita: oggi scrivi a una persona.","Torna al gesto più semplice finché il ritmo non riparte."],"M":["I momenti di passaggio, come compleanni e traguardi, chiedono presenza.","Un pasto senza telefoni una volta a settimana cambia le conversazioni.","La sera tardi è il momento delle confidenze: tienilo libero ogni tanto.","Il fine settimana scegli un momento solo per le persone.","Un messaggio dopo un incontro prolunga la sua bellezza."]},{"S":["Ogni settimana pensa a chi non senti da un po' e scrivigli.","Dai ai legami un margine: non riempire ogni sera di impegni.","Organizza un incontro speciale al mese.","Coinvolgi le persone nei tuoi progetti: lo slancio si condivide.","Alterna di chi ti prendi cura: famiglia, amici, colleghi."],"C":["Quattro abitudini di relazione chiedono autenticità, non obbligo.","Lo slancio nei legami è sentirsi circondati: proteggilo.","Quando tutto va bene, approfondisci invece di allargare.","I tuoi legami ormai sono una rete: ti sostiene nei momenti difficili.","Ascolta anche te stesso: dare troppo stanca."],"R":["Se lo slancio cala, torna per una settimana a una persona sola.","Dopo un periodo assente, un gesto sincero vale più di molte spiegazioni.","Un trasloco o un cambiamento allontana: riprendi con le chiamate.","Rimanda un incontro con una data precisa.","Chiediti chi ti manca e fai il primo passo."],"M":["Le feste sono occasioni, ma i giorni normali costruiscono i legami.","Dedica la domenica a una persona importante.","Fai il punto a fine mese: chi hai sentito, chi ti manca.","Dopo un periodo intenso, ritrova chi ti fa stare bene.","L'estate invita agli incontri all'aperto: approfittane."]},{"S":["I legami reggono da soli: allarga il cerchio a una persona nuova.","Scrivi cosa rende speciali le tue relazioni: ti guiderà nei momenti difficili.","Ogni stagione rinnova un rito condiviso.","Fai da ponte tra le persone che ami: i legami si moltiplicano.","Tieni sempre un gesto mini: un messaggio salva tante giornate."],"C":["La cura per gli altri è diventata naturale: custodiscila.","Ricorda quanto ti sentivi solo o distante all'inizio, e guarda ora.","I legami nutrono tutte le altre aree.","Su questa base puoi permetterti un progetto con gli altri.","Rinnova i rituali per non farli diventare abitudine vuota."],"R":["Anche all'orizzonte capitano periodi distanti: riparti da un messaggio.","Dopo una perdita, la presenza degli altri aiuta: lasciala entrare.","Un cambio di vita cambia le persone vicine: coltiva chi resta.","I legami veri sopportano le pause: riprendi con fiducia.","Una vacanza insieme può riaccendere un legame stanco."],"M":["Le serate d'estate sono perfette per le cene all'aperto.","L'inverno invita agli incontri in casa.","Un giorno al mese per qualcuno che non vedi spesso.","Il momento giusto per un nuovo legame è quando gli altri reggono.","Ogni anno ringrazia chi ti è stato accanto."]}],"Moss":[{"S":["Scegli un solo angolo da riordinare: un cassetto alla volta.","Lascia un cestino per le cose fuori posto: ogni sera lo svuoti.","Tieni una lista unica di cose da fare per la casa.","Lega il riordino a un gesto: dopo cena, cinque minuti di ordine.","Prepara il necessario per uscire la sera prima, vicino alla porta."],"C":["Cinque minuti di ordine oggi evitano un'ora di fatica nel weekend.","Non serve la casa perfetta: serve un angolo in ordine ogni giorno.","Ogni piccola cosa sistemata alleggerisce la mente.","In questa tappa conta il gesto, non quanto sistemi.","Una piccola cosa fatta subito non diventa un peso domani."],"R":["La casa è in disordine? Comincia da una superficie sola.","Una settimana senza ordine si recupera un cassetto alla volta.","Se ti senti sopraffatto, fai solo la cosa più visibile.","Non serve recuperare tutto: oggi solo il gesto mini.","Una bolletta scaduta si sistema: fallo adesso, poi respiri."],"M":["Il riordino serale prepara una mattina tranquilla.","Le pulizie veloci funzionano meglio prima di uscire.","Controlla le spese una volta a settimana, sempre lo stesso giorno.","Il sabato mattina è perfetto per le commissioni.","Prepara i vestiti la sera: la mattina guadagni minuti e calma."]},{"S":["Due gesti fissi: riordino serale e controllo degli impegni.","Scegli un giorno fisso per il bucato.","Prepara la lista della spesa mentre pianifichi i pasti.","Tieni un posto per i documenti importanti: tutti lì.","Usa promemoria per scadenze e rinnovi."],"C":["La radice dell'ordine è il ritorno quotidiano alle stesse piccole cose.","Anche nelle giornate piene, fai il riordino in versione mini.","L'ordine si costruisce con la ripetizione, non con le maratone.","Ogni settimana in ordine rende la successiva più facile.","Il muschio cresce piano ma copre tutto: così l'ordine."],"R":["Hai perso il ritmo? Riprendi dal riordino serale.","Se il bucato si accumula, fai una lavatrice adesso.","Dopo una settimana caotica, dedica mezz'ora a riprendere il controllo.","Le cose in sospeso pesano: chiudine una oggi.","Torna ai due gesti più semplici."],"M":["La domenica sera è il momento di guardare la settimana.","Il bucato funziona meglio la mattina, con tutto il giorno per asciugare.","Pianifica i pasti prima di fare la spesa.","Riordina il digitale una volta a settimana: email, foto, file.","Cura le piante al mattino, prima del caldo."]},{"S":["Piano B: se salta il riordino, sistema solo il tavolo.","Dividi le pulizie per stanze e giorni: niente maratone.","Tieni una cartella per abbonamenti e rinnovi.","Prepara i pasti per due giorni insieme.","Usa un calendario condiviso per gli impegni della casa."],"C":["Il flusso della vita pratica è non lasciare accumulare.","Tre attività pratiche si aiutano: l'ordine rende più facile cucinare.","Se la settimana è piena, fai le versioni corte ma non saltare.","La costanza si vede nella calma con cui affronti gli imprevisti.","Celebra una casa in ordine: goditela."],"R":["Il piano B esiste per giornate come oggi.","Hai rimandato una commissione? Fissala per domani con un orario.","Se le cose in sospeso si accumulano, scegline tre e chiudile.","Una settimana in disordine non è un fallimento: ricomincia stasera.","Torna a un solo gesto finché il ritmo non riparte."],"M":["Le commissioni raggruppate fanno risparmiare tempo.","Controlla gli abbonamenti a inizio mese.","Il riordino digitale funziona bene il venerdì pomeriggio.","Prepara le cose per uscire prima di andare a dormire.","La cura delle piante è un momento di pausa: rallenta."]},{"S":["Ogni settimana rivedi cosa si accumula e perché.","Dai alle faccende un margine: non riempire ogni sera.","Elimina una cosa che non usi ogni settimana.","Automatizza ciò che puoi: pagamenti, promemoria, liste.","Coinvolgi chi vive con te: lo slancio si condivide."],"C":["Quattro abitudini pratiche chiedono equilibrio, non perfezione.","Lo slancio nella vita pratica è avere tempo libero davvero libero.","Quando tutto è in ordine, mantieni invece di aggiungere.","La tua casa è ormai un luogo che ti sostiene.","Ascolta la stanchezza: l'ordine può aspettare un giorno."],"R":["Se lo slancio cala, torna per una settimana a riordino e impegni.","Dopo un trasloco o un cambiamento, riparti da una stanza.","Un periodo intenso al lavoro chiede faccende minime.","Rimanda con un giorno preciso.","Chiediti cosa ti fa accumulare e cambia quella cosa."],"M":["A inizio stagione fai il cambio degli armadi.","Fai il punto delle spese a fine mese.","Dedica una mattina al mese alle cose rimaste in sospeso.","Dopo un periodo intenso, concediti un riordino leggero.","Le giornate di pioggia sono perfette per l'ordine digitale."]},{"S":["La vita pratica va da sola: semplifica ancora, o prova un progetto per la casa.","Scrivi il tuo sistema: ti servirà se cambi casa o vita.","Ogni stagione rivedi cosa possiedi.","Insegna a chi vive con te il tuo modo di fare ordine.","Tieni sempre una versione mini per i periodi pieni."],"C":["L'ordine è diventato naturale: custodiscilo.","Ricorda com'era la casa all'inizio del percorso.","La vita pratica in ordine libera tempo per le altre aree.","Su questa base puoi permetterti un progetto nuovo.","Rinnova le abitudini per non renderle rigide."],"R":["Anche all'orizzonte capitano settimane di disordine: riparti da un cassetto.","Dopo un periodo difficile, torna alla scintilla: cinque minuti.","Un cambio di casa è l'occasione per un sistema nuovo.","L'ordine torna in fretta quando le abitudini ci sono.","Una vacanza lascia valigie e bucato: affrontali un giorno alla volta."],"M":["In primavera fai le grandi pulizie.","L'autunno è il momento di sistemare i documenti.","Un giorno al mese per le cose in sospeso.","Il momento giusto per un progetto per la casa è quando le basi reggono.","Ogni anno rivedi abbonamenti e spese."]}],"Nyx":[{"S":["Metti il telefono a caricare fuori dalla camera: il sonno comincia da lì.","Scegli un orario per andare a letto e mettilo come promemoria gentile.","Tieni un libro sul comodino: la mano lo trova invece dello schermo.","Lega il respiro a un gesto: dopo esserti lavato i denti, tre respiri lenti.","Abbassa le luci un'ora prima di dormire: il corpo capisce che è sera."],"C":["Tre respiri lenti oggi sono già una pausa vera.","Il riposo non si guadagna: si prende, anche cinque minuti.","Non serve meditare a lungo: serve tornare al respiro ogni giorno.","Ogni sera che rispetti l'orario, il sonno arriva un po' più facile.","In questa tappa conta il gesto, non quanto riesci a rilassarti."],"R":["Hai fatto tardi ieri? Stasera torna all'orario, senza recuperare.","Saltata la pausa? Fai un minuto di silenzio adesso.","Una notte storta non rovina la settimana: oggi riposa bene.","Se la mente corre, scrivi i pensieri e chiudi il quaderno.","Non forzare il sonno: alzati, leggi, torna quando arriva."],"M":["L'ultima ora prima di dormire è sacra: niente lavoro, niente notizie.","Una pausa senza schermi a metà pomeriggio rimette in ordine la testa.","Il risveglio senza telefono ti regala i primi minuti della giornata.","Prendi luce naturale al mattino: aiuta il sonno della sera.","Dopo pranzo bastano dieci minuti a occhi chiusi."]},{"S":["Due gesti fissi la sera: luci basse e quaderno dei pensieri.","Prepara la camera: fresca, buia, silenziosa.","Tieni lo stesso orario anche nel fine settimana, con poca differenza.","Scegli una musica rilassante sempre uguale: diventa il segnale del riposo.","Prepara le cose per domani prima del rituale: la mente si quieta."],"C":["La radice del riposo è la regolarità: stesso orario, stessa sequenza.","Anche nelle sere tardive, fai il rituale in versione corta.","Il corpo impara il ritmo in qualche settimana: abbi pazienza.","Ogni pausa vera rende la giornata più leggera: non saltarle.","Il riposo costante si sente nell'umore, prima ancora che nel corpo."],"R":["Hai perso il ritmo del sonno? Riparti dall'orario di sveglia.","Se il rituale è troppo lungo, tienine un solo gesto.","Dopo una settimana caotica, una sera senza impegni rimette tutto a posto.","Il riposo non è tempo perso: riprendilo senza sensi di colpa.","Se la sera ti sfugge, sposta la pausa a metà giornata."],"M":["Il caffè dopo le quattro del pomeriggio può rubarti la notte.","Una doccia tiepida prima di dormire aiuta il corpo a rilassarsi.","Scrivi i pensieri prima di spegnere la luce, non a letto con gli occhi aperti.","La mattina presto, prima del telefono, è il momento più tranquillo.","Un minuto di respiro prima di una riunione cambia come la vivi."]},{"S":["Piano B: se il rituale salta, fai solo tre respiri lenti a letto.","Alterna pause attive e pause ferme durante la giornata.","Prepara una pausa di silenzio nel calendario, come un impegno.","Tieni un angolo della casa senza schermi per riposare.","Usa un timer per le pause: finita la pausa, si riparte con calma."],"C":["Il flusso del riposo è un ritmo: lavoro, pausa, lavoro, pausa.","Tre attività di riposo si sostengono: meno schermi aiuta il sonno.","Nelle settimane piene, il riposo serve di più: non tagliarlo per primo.","La costanza nel riposo si vede in quanto reggi lo stress.","Riposare bene è un'abilità: migliora con la pratica."],"R":["Il piano B è per stasera: usalo e dormi.","Hai saltato le pause? Domani mettine una sola, ma fissa.","Una notte di insonnia non è un fallimento: domani si riprende.","Se il rituale annoia, cambia un elemento e tieni l'orario.","Torna a un solo gesto finché il flusso non riparte."],"M":["Le pause funzionano meglio ogni novanta minuti di attività.","Il pomeriggio presto è il momento naturale di calo: rispettalo.","Nei weekend riposa senza stravolgere l'orario della sveglia.","Una passeggiata serale lenta prepara al sonno.","Prima di un giorno importante, riposa invece di prepararti ancora."]},{"S":["Ogni settimana rivedi come dormi: annota quando va meglio e perché.","Dai al riposo un margine anche nelle giornate piene.","Pianifica una sera a settimana completamente libera.","Rendi la camera ancora più accogliente: un dettaglio alla volta.","Alterna forme di riposo diverse: silenzio, musica, natura."],"C":["Quattro abitudini di riposo richiedono gentilezza, non rigidità.","Lo slancio nel riposo è sentirsi carichi: proteggilo.","Quando dormi bene, non aggiungere impegni la sera: consolida.","Il tuo riposo ormai è una base: tutto il resto ci si appoggia.","Ascolta la stanchezza prima che diventi esaurimento."],"R":["Se lo slancio cala, torna per una settimana a orario e respiro.","Dopo un periodo di poco sonno, recupera con regolarità, non con lunghe dormite.","Un viaggio sconvolge il ritmo: riparti dalla luce del mattino.","Rimanda una pausa con un orario preciso, non a quando capita.","Chiediti cosa ti ha tolto riposo e proteggi quel confine."],"M":["In autunno anticipa il rituale serale: il buio arriva prima.","Dopo una settimana intensa, dedica la domenica al recupero.","Fai il punto a fine mese su come dormi.","La pausa senza stimoli funziona meglio all'aperto.","Dopo un evento faticoso, concediti una sera tutta lenta."]},{"S":["Il riposo va da solo: prova una pratica nuova, come la meditazione guidata.","Scrivi il tuo rituale ideale: ti servirà nei periodi difficili.","Ogni stagione rivedi i tuoi orari: la luce cambia, anche tu.","Insegna a chi vive con te il valore del silenzio serale.","Tieni una versione mini del rituale per le notti fuori casa."],"C":["Il tuo riposo è diventato un'abitudine stabile: custodiscila.","Ricorda come dormivi all'inizio del percorso: guarda la differenza.","Il riposo nutre tutte le altre aree: è il tuo fondamento.","Su questa base puoi permetterti un obiettivo nuovo.","Rinnova il rituale ogni tanto per non farlo diventare meccanico."],"R":["Anche all'orizzonte capitano notti difficili: torna al respiro.","Dopo un periodo intenso, ricomincia dalla luce bassa la sera.","Un cambio di vita cambia gli orari: ricostruisci il rituale con calma.","Il corpo sa riposare: dagli solo le condizioni giuste.","Una vacanza è l'occasione per riscoprire il sonno naturale."],"M":["Le sere d'estate invitano a uscire: proteggi comunque l'orario.","L'inverno chiede più sonno: concediglielo.","Un giorno al mese di vero riposo, senza programmi.","Il momento giusto per una pratica nuova è quando le basi reggono.","Ogni anno rivedi cosa ti fa davvero riposare."]}],"Sage":[{"S":["Lascia il libro o il quaderno aperto dove ti siedi: l'occhio fa partire la mano.","Tieni sempre a portata lo strumento giusto: una penna, uno spartito, una pagina.","Scegli prima cosa leggerai o studierai: decidere al momento consuma la voglia.","Lega lo studio a un gesto quotidiano: dopo cena, cinque pagine.","Metti il telefono in un'altra stanza: la mente si accende quando non è divisa."],"C":["Una pagina al giorno, in un anno, è un libro intero.","Cinque minuti di pratica oggi lasciano una traccia che domani ritrovi.","Non serve ispirazione per creare: serve sedersi, e lei arriva.","Fermati a metà di una frase: domani saprai subito da dove ripartire.","In questa tappa conta solo presentarsi: la qualità crescerà da sola."],"R":["Saltato un giorno? Leggi una sola riga oggi: il filo si riannoda.","Non ricominciare dall'inizio: riprendi dalla pagina dove ti eri fermato.","Se lo studio ti pesa, cambia argomento per un giorno ma tieni il momento.","La curiosità si risveglia facendo: apri il libro, anche senza voglia.","Un giorno vuoto non cancella quello che hai imparato."],"M":["La mente impara meglio dopo una pausa breve: non studiare a stomaco pieno.","Al mattino la memoria è fresca: è il momento giusto per le cose nuove.","La sera è adatta a ripassare: il sonno fissa ciò che hai visto.","Crea quando sei appena sveglio: il giudizio interno dorme ancora.","Dieci minuti in attesa di qualcosa sono perfetti per una pagina."]},{"S":["Due gesti fissi: prima leggi, poi annoti una frase che ti ha colpito.","Tieni un quaderno unico per le idee: tutto in un posto, niente si perde.","Prepara la sessione di studio con un obiettivo preciso: un capitolo, un esercizio.","Riserva un angolo della casa alla creatività: entrarci è già iniziare.","Usa la stessa musica o lo stesso silenzio ogni volta: diventa il tuo segnale."],"C":["La radice della conoscenza è il ripasso: rivedere vale quanto imparare.","Due gesti piccoli e fissi valgono più di una maratona di studio una volta al mese.","Anche in giornata piena, leggi una pagina: la radice resta viva.","Ogni giorno di pratica rende la mano più sicura: non vedi ancora, ma succede.","La costanza creativa nasce da un appuntamento fisso con te stesso."],"R":["Hai perso il ritmo? Torna al tuo angolo, stesso orario, un solo esercizio.","Se un libro non ti prende più, cambialo: l'abitudine conta più del titolo.","Riprendere uno strumento dopo una pausa: suona solo ciò che sai già.","Un'idea abbandonata può ripartire: rileggi gli appunti e aggiungi una riga.","Quando la testa è piena, il gesto mini è ascoltare invece di leggere."],"M":["Leggi prima di dormire, ma su carta: lo schermo ruba il sonno.","Studia nello stesso posto e alla stessa ora: il cervello si prepara da solo.","Il fine settimana è adatto ai progetti creativi lunghi.","Usa il tragitto per ascoltare un contenuto che ti insegna qualcosa.","Le idee migliori arrivano camminando: tieni le note a portata."]},{"S":["Piano B creativo: se non hai tempo per creare, raccogli spunti per dieci minuti.","Alterna studio e pratica: leggi un concetto, poi provalo subito.","Usa le schede di ripasso: brevi, frequenti, mirate.","Tieni una lista di progetti piccoli pronti: quando hai tempo, ne scegli uno.","Chiudi ogni sessione scrivendo cosa hai capito: in tre righe."],"C":["Il flusso creativo arriva dopo i primi quindici minuti: resta oltre la soglia.","Tre attività di mente insieme si sostengono: leggere nutre lo scrivere.","Quando la giornata salta, fai la versione corta: il ritmo conta più della durata.","La costanza nello studio si misura sulle settimane, non sulle singole sere.","Non giudicare quello che crei mentre lo crei: c'è tempo dopo."],"R":["Bloccato? Cambia strumento: dalla tastiera alla carta, dal disegno alla foto.","Hai saltato giorni di pratica? Il primo giorno è solo per riscaldarti.","Se un progetto ti spaventa, dividilo in un passo da cinque minuti.","Riprendere a studiare: ripassa l'ultima cosa che sapevi bene.","Un periodo arido è normale: continua a raccogliere, l'idea tornerà."],"M":["La concentrazione profonda vive meglio in blocchi da quaranta minuti.","Dopo un'attività fisica la mente è più pronta a imparare.","Crea quando la casa è in silenzio: mattina presto o sera tardi.","Il ripasso funziona meglio a intervalli: oggi, fra tre giorni, fra una settimana.","Una pausa all'aria aperta sblocca più di un'ora davanti alla pagina vuota."]},{"S":["Ogni settimana rivedi cosa hai imparato: il sapere cresce quando lo colleghi.","Dai ai progetti creativi una scadenza morbida: lo slancio ama un traguardo.","Condividi qualcosa che hai creato: il riscontro alimenta lo slancio.","Tieni un archivio delle cose finite: rivederle dà energia per le prossime.","Alterna progetti lunghi e piccole creazioni veloci per non perdere il gusto."],"C":["Quattro attività di mente richiedono margine: non riempire tutte le sere.","Lo slancio creativo si nutre di finire le cose, anche imperfette.","Mantieni il ripasso anche quando impari cose nuove: è lui che trattiene.","Quando tutto scorre, non aggiungere: approfondisci quello che fai già.","La tua costanza è diventata una competenza: si vede in ciò che produci."],"R":["Se lo slancio cala, torna per una settimana a una sola pratica.","Un progetto arenato può aspettare: intanto tieni vivo il gesto quotidiano.","Dopo un periodo intenso concediti letture leggere: anche questo è nutrimento.","Rimanda con una data: la creatività ama gli appuntamenti precisi.","Chiediti cosa ti ha tolto il piacere e cambia quella sola cosa."],"M":["Pianifica la settimana creativa la domenica: un progetto, tre sessioni.","Usa le mattine del fine settimana per le cose che richiedono respiro.","Fai il punto a metà mese su quello che hai imparato.","Dopo aver finito un progetto, lascia un giorno vuoto prima del prossimo.","La sera presto è ideale per la pratica tecnica, la mattina per inventare."]},{"S":["Le pratiche reggono da sole: è il momento di imparare qualcosa di nuovo.","Scrivi il tuo metodo di studio: sarà utile a te e a chi lo legge.","Ogni stagione scegli un tema da esplorare: la mente ama le direzioni.","Insegna ciò che sai: spiegare è la forma più profonda di ripasso.","Tieni le versioni mini sempre pronte: anche la mente più allenata ha giorni pigri."],"C":["Ormai leggere e creare fanno parte di te: proteggili dai periodi pieni.","Rileggi i tuoi primi quaderni: guarda quanta strada hai fatto.","Una mente curiosa resta curiosa se continua a farsi domande.","La costanza raggiunta è la base per un progetto ambizioso: scegline uno.","Non dare per scontato il tuo ritmo: rinnova ogni tanto il motivo per cui lo fai."],"R":["Anche all'orizzonte capitano settimane vuote: riparti da una pagina.","Se una passione si spegne, lasciala riposare e prova un nuovo linguaggio.","Dopo un periodo difficile, torna alla scintilla: cinque minuti.","Il sapere accumulato non si perde: riprendi da dove ti senti sicuro.","Ritrova il gusto rifacendo una cosa che ti è sempre piaciuta."],"M":["Usa i viaggi e i cambi di stagione per nuovi stimoli.","Un giorno al mese dedicato solo a esplorare, senza obiettivi.","Il momento giusto per un progetto grande è quando le basi vanno da sole.","La sera tranquilla è perfetta per riflettere su ciò che hai creato.","Ogni anno scegli una competenza nuova da coltivare."]}]};

    if(d.iback!=null){if(OV.i>0){OV.i--;drawIntro()}else closeOv();return}}

    if(d.aw){m.x.w=d.aw;drawAdd();return}
    if(d.ad!=null){const i=+d.ad,x=m.x;x.days=x.days.includes(i)?x.days.filter(z=>z!==i):[...x.days,i].sort();if(!x.days.length)x.days=[i];x.f=x.days.length;drawAdd();return}

/* gesti: indietro trascinando a destra, chiudi i pannelli trascinando in basso, niente blocchi dello scorrimento */
(function(){let sx=0,sy=0,t0=0,mode=null,el=null,lx=0,ly=0;
const ovEl=()=>document.querySelector("#ov .ov:not(.out)");
const sheetOpen=()=>document.querySelector("#sh .scrim,#cvw .scrim,.w3.legon");
const backBtn=()=>{const o=ovEl();return o&&!sheetOpen()?o.querySelector('[aria-label="Indietro"]'):null};
const sT=(n,y)=>n.classList.contains("leg3")?`translate(-50%,${y}px)`:`translateY(${y}px)`;
document.addEventListener("touchstart",e=>{mode=null;if(e.touches.length>1)return;const p=e.touches[0];sx=lx=p.clientX;sy=ly=p.clientY;t0=Date.now();el=e.target.closest&&e.target.closest(".scrim .sheet,.w3.legon .leg3")},{passive:true});
document.addEventListener("touchmove",e=>{if(e.touches.length>1)return;const p=e.touches[0];lx=p.clientX;ly=p.clientY;const dx=lx-sx,dy=ly-sy;
 if(!mode){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
  if(el&&dy>0&&Math.abs(dy)>Math.abs(dx)&&el.scrollTop<=0)mode="down";
  else if(Math.abs(dx)>Math.abs(dy)*1.2){let q=e.target,ok=false;while(q&&q!==document.body){const c=getComputedStyle(q);if(/(auto|scroll)/.test(c.overflowX)&&q.scrollWidth>q.clientWidth+1){ok=true;break}q=q.parentElement}
   mode=ok?"h":(dx>0&&backBtn()&&sx<innerWidth*.7)?"back":"block"}
  else{mode="v";let q=e.target,can=false;while(q&&q!==document.body&&q!==document.documentElement){const c=getComputedStyle(q);if(/(auto|scroll)/.test(c.overflowY)&&q.scrollHeight>q.clientHeight+1){can=true;break}q=q.parentElement}
   const se=document.scrollingElement||document.documentElement;if(!can&&se&&se.scrollHeight<=innerHeight+1)mode="block"}}
 if(mode==="down"){e.preventDefault();el.style.transition="none";el.style.transform=sT(el,Math.max(0,dy))}
 else if(mode==="back"){e.preventDefault();const o=ovEl();if(o){o.style.transition="none";o.style.transform=`translateX(${Math.max(0,dx)}px)`;o.style.boxShadow="-12px 0 30px rgba(30,27,75,.12)"}}
 else if(mode==="block")e.preventDefault()},{passive:false});
document.addEventListener("touchend",()=>{const dx=lx-sx,dy=ly-sy,v=(mode==="down"?dy:dx)/Math.max(1,Date.now()-t0);
 if(mode==="down"&&el){const n=el;const go=dy>110||(dy>40&&v>.5);n.style.transition="transform .28s cubic-bezier(.2,.8,.3,1)";
  if(go){const sc=n.closest(".scrim");if(sc){n.style.transform=sT(n,n.offsetHeight);setTimeout(()=>sc.click(),60)}else{n.style.transform="";const ls=document.querySelector(".w3 .lscrim");if(ls)ls.click()}}
  else n.style.transform="";setTimeout(()=>{n.style.transition=""},320)}
 if(mode==="back"){const o=ovEl();const b=backBtn();const go=dx>innerWidth*.3||(dx>40&&v>.5);if(o){o.style.transition="transform .25s cubic-bezier(.2,.8,.3,1)";
  if(go&&b){o.style.transform=`translateX(${innerWidth}px)`;setTimeout(()=>{b.click();const o2=ovEl();if(o2){o2.style.transition="none";o2.style.transform="";o2.style.boxShadow=""}},200)}
  else{o.style.transform="";setTimeout(()=>{o.style.transition="";o.style.boxShadow=""},260)}}}
 mode=null;el=null},{passive:true});
document.addEventListener("touchcancel",()=>{const o=ovEl();if(o){o.style.transform="";o.style.boxShadow=""}if(el)el.style.transform="";mode=null;el=null},{passive:true});
})();

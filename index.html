se irrinunciabili?","Usa la matrice importante/urgente una volta a settimana.","Tieni un unico sistema di cattura, sempre a portata.","Fai la revisione settimanale con una checklist fissa.","Crea liste per contesto: al computer, al telefono, fuori casa.","Automatizza i promemoria per tutto ciò che si ripete.","Usa modelli per i progetti che fai spesso.","Delega ciò che altri possono fare meglio o più velocemente.","Stabilisci delle regole per le richieste: cosa accetti subito, cosa rimandi.","Tieni il calendario per gli impegni e la lista per le azioni: non mescolarli.","Prepara un'agenda per ogni riunione che organizzi.","Elimina gli strumenti che non hai usato nell'ultimo mese.","Lascia buffer di quindici minuti tra impegni importanti.","Scrivi le decisioni prese in un posto solo.","Rivedi i progetti attivi ogni settimana: quale avanza, quale è fermo?"],"C":["Il flusso nasce quando sai sempre qual è la prossima azione.","Tre giorni con il sistema in ordine valgono una settimana più serena.","Se la settimana è piena, tieni almeno la revisione.","Il piano B è una forma di disciplina, non una resa.","La tua produttività si misura sui progetti chiusi, non sui compiti spuntati.","Più il sistema è semplice, più a lungo lo userai.","Dire di no è una competenza organizzativa.","Ogni ciclo chiuso è energia restituita.","La costanza nel sistema riduce l'ansia delle scadenze.","Le giornate migliori sono quelle in cui sai cosa ignorare.","Il focus profondo è il premio per un sistema ben tenuto.","Più sei chiaro con te stesso, più sei chiaro con gli altri.","Allena la scelta: ogni giorno decidi cosa non farai.","Il tuo tempo è finito: il sistema serve a spenderlo bene.","Celebra la revisione settimanale: è il tuo momento di controllo."],"R":["Il piano B è fatto per i giorni come oggi.","Se il sistema si è inceppato, fai una raccolta completa e ricomincia.","Quando una scadenza è saltata, comunica subito e proponi una nuova data.","Se ti senti in ritardo su tutto, scegli una sola cosa da completare oggi.","Ricomincia dalla lista per contesto più facile.","Se le email sono migliaia, archivia tutto ciò che è più vecchio di un mese.","Dopo una settimana di emergenze, fai una mini-revisione di quindici minuti.","Torna ai due momenti fissi per le email.","Se hai detto troppi sì, rinegozia un impegno oggi.","Quando il calendario è pieno di cose altrui, riprenditi un blocco per te.","La ripartenza migliore è semplificare.","Se il sistema non ti piace più, cambia un solo strumento.","Torna al principio: una priorità al giorno.","Dopo le ferie dedica la prima ora a rimettere in ordine, non a rispondere.","Non aspettare il momento giusto per riorganizzarti: bastano venti minuti adesso."],"M":["La revisione settimanale funziona meglio sempre nello stesso giorno.","Pianifica la settimana prima che te la pianifichino gli altri.","Le decisioni importanti prendile la mattina, a mente fresca.","Dopo una riunione lunga fai una pausa prima del compito successivo.","Concentra le riunioni in due giorni, se puoi.","A metà giornata ricontrolla la priorità: è ancora quella giusta?","Il primo giorno del mese rivedi gli abbonamenti e gli strumenti.","Prima di una settimana intensa, sgombra la lista dai compiti minori.","Quando l'energia è bassa, fai i compiti «al telefono» o «da cinque minuti».","A fine giornata svuota la scrivania fisica e digitale.","Durante i viaggi lavora sulla lista per contesto «ovunque».","Nei periodi di picco rivedi la lista due volte al giorno.","Fai le cose noiose tutte insieme in un blocco solo.","Il martedì mattina è spesso il momento migliore per i compiti difficili.","Dopo una giornata di caos, rileggi la lista prima di dormire e poi chiudi."]},{"S":["Ogni mese rivedi gli obiettivi e collega a ognuno un progetto attivo.","Tieni una lista «forse un giorno» per le idee non urgenti.","Usa la revisione settimanale per pianificare i blocchi di lavoro profondo.","Crea procedure scritte per i processi ripetuti.","Rivedi chi ti manda più richieste e stabilisci canali chiari.","Automatizza un compito ripetitivo ogni mese.","Usa una dashboard semplice dei progetti: stato, prossima azione, scadenza.","Tieni un archivio ordinato per anno e progetto.","Elimina le riunioni ricorrenti inutili ogni trimestre.","Prepara un piano per le settimane di alto carico.","Condividi il tuo sistema con chi lavora con te: meno attriti.","Usa le note per registrare decisioni e motivazioni.","Rivedi le notifiche del telefono ogni mese.","Stabilisci un limite massimo di progetti attivi.","Fai pulizia digitale una volta al trimestre."],"C":["Lo slancio arriva quando il sistema lavora per te.","Con più progetti, il margine diventa ancora più importante.","Quando tutto scorre, non aggiungere: consolida.","La chiarezza ti rende più veloce di chi corre senza direzione.","Il tuo sistema ora è un alleato: fidati di lui.","Concentrati sui progetti che spostano davvero qualcosa.","Celebra i progetti chiusi: è la tua scossa di energia.","La disciplina è fare la revisione anche quando sembra inutile.","Ogni processo scritto è tempo regalato al te del futuro.","Il focus cresce quando riduci le scelte superflue.","Più delegati con chiarezza, più tempo resta per ciò che conta.","Tieni d'occhio il carico: lo slancio non è velocità infinita.","La tua organizzazione è diventata una competenza da valorizzare.","Ogni settimana in ordine costruisce reputazione e fiducia.","Ricorda: l'obiettivo è il tempo libero, non l'efficienza in sé."],"R":["Se lo slancio rallenta, torna per una settimana a tre compiti al giorno.","Un periodo di caos richiede una revisione profonda, non solo spunte.","Se i progetti sono troppi, mettine due in pausa dichiarata.","Rimanda con una data precisa ciò che non puoi fare ora.","Dopo un cambio di ruolo, ricostruisci le liste per contesto.","Se ti senti esausto, riduci gli impegni prima di aumentare la disciplina.","Quando un processo non funziona più, riscrivilo.","Dopo una crisi, riparti dalla revisione settimanale.","Se l'inbox è fuori controllo, dichiara bancarotta delle email e riparti.","Il sistema si adatta: non è un fallimento cambiarlo.","Torna alla lista unica se le liste si sono moltiplicate.","Se perdi motivazione, rivedi perché fai quei progetti.","Riprendi le abitudini un rituale alla volta.","Dopo un mese storto, scegli un solo obiettivo per il mese nuovo.","Riparti chiedendo aiuto: delegare è anche ripartire."],"M":["Pianifica il trimestre nella prima settimana del trimestre.","A fine mese fai il punto su obiettivi e progetti.","Le giornate senza riunioni usale per i progetti grandi.","Prima di prendere un impegno nuovo, guarda il calendario delle settimane successive.","Dopo un lancio, dedica un pomeriggio a sistemare l'archivio.","Nei periodi tranquilli migliora i processi.","Il lunedì mattina conferma i tre risultati della settimana.","Il giovedì controlla cosa rischia di slittare.","Prima delle feste chiudi i progetti piccoli.","Al rientro dalle ferie dedica mezza giornata alla revisione.","Pianifica le attività impegnative nei giorni in cui hai meno riunioni.","Rivedi le priorità quando cambia qualcosa di importante nella tua vita.","Usa le ultime settimane dell'anno per pianificare l'anno nuovo.","Fai le revisioni nello stesso posto: diventa un rito.","Quando un progetto si chiude, archivialo il giorno stesso."]},{"S":["Il sistema va da solo: usa l'energia liberata per un progetto personale.","Scrivi la tua guida al tuo metodo di organizzazione.","Ogni anno semplifica: togli uno strumento, una regola, una lista.","Insegna a qualcuno la revisione settimanale.","Tieni pronta una versione minima del sistema per i periodi difficili.","Crea un archivio delle decisioni importanti dell'anno.","Rivedi i tuoi principi di priorità una volta l'anno.","Costruisci margini strutturali: giornate libere nel calendario.","Coltiva la capacità di stare senza lista nei momenti di riposo.","Usa il sistema anche per la vita personale, con leggerezza.","Pianifica l'apprendimento come pianifichi il lavoro.","Tieni un registro delle idee migliori dell'anno.","Prepara una checklist per l'inizio di ogni nuovo progetto.","Valuta ogni impegno con una domanda: mi avvicina a ciò che conta?","Condividi i tuoi modelli con il team."],"C":["All'orizzonte l'organizzazione è il modo in cui pensi, non un compito.","Rileggi le liste dei primi giorni: vedrai quanto sei cambiato.","Anche un sistema maturo ha bisogno di revisione.","La chiarezza raggiunta ti permette obiettivi più ambiziosi.","Non perdere la leggerezza: il sistema serve a vivere meglio.","Il tuo tempo è la risorsa più preziosa: continua a sceglierlo.","La vera produttività include il riposo.","Più sei esperto, più è importante non complicare.","Proteggi la tua attenzione come un bene comune.","Ricorda che puoi dire di no anche alle buone opportunità.","L'efficienza senza direzione non serve: rinnova la direzione.","La tua calma è il risultato più visibile del tuo sistema.","Aiutare altri a organizzarsi consolida il tuo metodo.","Ogni anno celebra ciò che hai portato a termine.","La costanza raggiunta è libertà, non rigidità."],"R":["Anche all'orizzonte capitano mesi caotici: riparti dalla revisione.","Se cambi lavoro o città, ricostruisci il sistema da zero ma con calma.","Un sistema dimenticato si riattiva in una settimana.","Dopo una malattia o un periodo duro, torna alla priorità singola.","Se ti senti troppo rigido, concediti una settimana senza liste.","Il tuo metodo ha già superato altre crisi: fidati.","Ricomincia dalla cattura: scrivi tutto ciò che hai in testa.","Quando la vita cambia, cambia anche il sistema.","Se ti senti sopraffatto, riduci gli impegni prima di riorganizzarti.","Non devi tornare al sistema di prima: costruiscine uno per oggi.","Una revisione annuale saltata si fa anche a marzo.","Ritrova il senso: organizzarti serve a ciò che ami.","Riparti con una sola lista e un solo calendario.","Se il team è cambiato, ridefinisci i canali di comunicazione.","Ogni ripartenza ti insegna qualcosa sul tuo modo di lavorare."],"M":["A fine anno fai una revisione completa dell'anno passato.","Il primo giorno dell'anno scegli tre obiettivi, non dieci.","Ogni stagione rivedi i tuoi orari: l'energia cambia.","Programma una giornata di riflessione ogni trimestre.","Prima di un grande cambiamento, consolida le abitudini base.","Dopo un progetto lungo, prenditi una pausa prima del successivo.","Il momento giusto per semplificare è quando tutto funziona.","Usa i periodi di calma per migliorare il sistema.","Prima delle vacanze lunghe prepara una lista di rientro.","Nei mesi intensi tieni solo i rituali essenziali.","A metà anno controlla se gli obiettivi hanno ancora senso.","Quando ti accorgi di correre troppo, rallenta per una settimana.","La sera tardi non pianificare: rimanda alla mattina.","Rivedi gli strumenti digitali una volta l'anno.","Ogni compleanno è un buon momento per ripensare le priorità."]}],"Wisp":[{"S":["Scegli un gioco o un hobby che ti incuriosisce: un fuoco fatuo si segue per curiosità.","Lascia l'oggetto del tuo hobby in vista: la chitarra fuori dalla custodia, il puzzle sul tavolo.","Lega il gioco a un gesto: dopo cena, quindici minuti solo per divertirti.","Prepara una lista di dieci cose che ti piacerebbe provare.","Scegli un hobby che non serva a niente: il gioco vale per sé.","Metti un promemoria con scritto «gioca».","Prepara il materiale del gioco la sera prima: domani basterà allungare la mano.","Usa un timer da quindici minuti per proteggere il tempo del gioco.","Spegni le notifiche durante l'hobby.","Scegli un angolo della casa per il tuo passatempo.","Annota ogni volta che giochi: piccole luci nella settimana.","Prova qualcosa di nuovo una volta a settimana, anche minuscolo.","Tieni un quaderno delle scoperte: ogni cosa nuova provata merita una riga.","Invita un amico a provare qualcosa con te.","Togli il senso del dovere: se non ti piace, cambia gioco."],"C":["Il gioco ricarica: va messo in agenda come il resto.","Quindici minuti di gioco al giorno cambiano l'umore.","Non serve essere bravi: serve divertirsi.","Ogni scoperta è una piccola luce che danza.","Conta i momenti di gioco, non i risultati.","Gli adulti hanno bisogno di giocare quanto i bambini, ricorda Stuart Brown.","In questa tappa conta concederti il tempo.","Celebra la prima volta che perdi la nozione del tempo.","Il gioco senza scopo è il più rigenerante.","La curiosità è una bussola che porta lontano.","Ogni hobby nuovo allarga il mondo un po' oltre i soliti confini.","Non sentirti in colpa per divertirti.","Il fuoco fatuo si mostra a chi lo segue.","Ridere è una forma di cura: cerca il gioco che ti fa ridere davvero.","Il gioco rende più creativi anche nel lavoro."],"R":["Saltato il gioco? Fai cinque minuti adesso.","Non sentirti in colpa per aver lavorato tanto: gioca oggi.","Se l'hobby ti annoia, provane un altro dalla lista.","Una settimana senza gioco è un segnale: rimettilo in agenda.","Mai saltare due settimane senza qualcosa di divertente.","Se sei stanco, scegli un gioco rilassante.","Torna al quaderno delle scoperte e scegli la prossima cosa da provare.","Se ti senti in colpa a giocare, ricorda che ricarica.","Riparti con un amico: il gioco in due ricomincia più facilmente.","Se il gioco è diventato competizione, torna al piacere.","Ripartire è giocare di nuovo: non serve una ragione, basta la voglia.","Se non hai idee, esplora il quartiere.","Ricomincia con la lista delle dieci cose.","Il fuoco fatuo riappare dove meno te lo aspetti.","Ogni ritorno al gioco è una piccola festa: trattalo così."],"M":["La sera, dopo cena, è il momento naturale del gioco.","Il weekend regala tempi lunghi per esplorare.","In pausa pranzo concediti un gioco breve invece dello scroll infinito.","Dopo una giornata faticosa, un hobby rilassante.","Al mattino del sabato, una scoperta nuova.","Durante le vacanze, prova qualcosa di mai fatto.","Nei giorni di pioggia, giochi da tavolo.","Nei giorni di sole, esplorazione all'aperto.","Dopo un traguardo, gioca per festeggiare.","Prima di dormire, un gioco tranquillo.","Durante i viaggi, osserva con curiosità.","Quando ti senti bloccato su un problema, gioca: la mente libera trova vie nuove.","La domenica pomeriggio, un hobby lungo.","Nei momenti di attesa, un piccolo gioco mentale.","Il momento fisso diventa una promessa di leggerezza."]},{"S":["Due gesti fissi: un momento di gioco al giorno e una scoperta a settimana.","Programma un'uscita di esplorazione ogni settimana.","Tieni una scatola dei giochi pronta.","Scegli un hobby principale e uno di esplorazione.","Unisciti a un gruppo legato al tuo hobby.","Tieni un diario delle esperienze nuove.","Pianifica una gita fuori porta al mese.","Impara le basi di un'attività nuova con un video.","Crea una playlist o un ambiente per il tuo hobby.","Prenota un corso breve su qualcosa che ti incuriosisce da tempo.","Organizza una serata giochi con amici.","Tieni un budget piccolo per le scoperte.","Scegli un luogo nuovo da visitare nella tua città ogni mese.","Prova un cibo nuovo ogni settimana: anche il palato sa esplorare.","Cambia strada per tornare a casa una volta a settimana."],"C":["La radice del gioco è il tempo protetto.","Due gesti fissi mantengono viva la curiosità.","Anche nelle settimane piene, un gioco breve.","Le esplorazioni regolari rendono la vita più ricca.","Il gruppo rende il gioco più divertente.","Ogni esperienza nuova crea un ricordo.","La curiosità allenata diventa un tratto.","Il fuoco fatuo ti porta in posti inattesi.","Celebra il primo mese di esplorazioni.","Il gioco condiviso crea legami che il lavoro da solo non crea.","Le piccole novità rompono la routine.","Il diario delle esperienze diventa un tesoro.","L'hobby principale cresce con la regolarità.","Il gioco è un diritto anche da adulti, non un premio da guadagnare.","La leggerezza è una forza: rende sopportabili anche i giorni pesanti."],"R":["Hai perso il ritmo? Torna al gioco quotidiano.","Se l'esplorazione è saltata, fai una passeggiata in una zona nuova.","Dopo una settimana pesante, una serata giochi.","Torna al gruppo del tuo hobby: la compagnia riaccende la scintilla.","Se il corso è finito, scegline un altro.","Riprendi il diario delle esperienze.","Se il budget è finito, cerca scoperte gratuite.","Torna al luogo nuovo del mese: scegline uno vicino e vai questa settimana.","Se ti annoi, cambia hobby di esplorazione.","Riparti da un cibo mai assaggiato: la curiosità si risveglia anche a tavola.","Ricomincia cambiando strada per tornare a casa: piccola deviazione, grande effetto.","Se ti senti solo, invita qualcuno a fare con te una cosa nuova.","Torna alla scatola dei giochi e apri quello che non usi da più tempo.","Ogni ritorno porta leggerezza: non c'è niente da recuperare, solo da godere.","Il fuoco fatuo ti aspetta dove l'avevi lasciato: seguilo di nuovo."],"M":["Il sabato mattina è il momento perfetto per un'esplorazione senza fretta.","La sera, dopo i doveri, il gioco aiuta a staccare davvero.","All'inizio di ogni mese scegli la meta della gita fuori porta.","Il gruppo dell'hobby funziona bene a metà settimana, quando serve una pausa.","Fissa il corso in un giorno in cui non hai impegni la sera.","Il venerdì sera è ideale per una serata giochi con amici.","Nel weekend hai il tempo per assaggiare un cibo nuovo con calma.","La strada nuova al rientro dal lavoro.","La domenica è adatta a visitare un luogo nuovo della tua città.","Scrivi sul diario subito dopo ogni esperienza, finché il ricordo è vivo.","Guarda un breve tutorial in pausa pranzo e provalo la sera.","Dedica all'hobby principale qualche minuto ogni giorno, anche pochi.","L'ambiente creato prima di iniziare.","Decidi a inizio mese quanto spendere per le scoperte, così giochi sereno.","Tieni fisso il momento del gioco: diventa un appuntamento atteso."]},{"S":["Piano B: se non hai tempo per l'hobby, un gioco di cinque minuti.","Alterna hobby attivi e tranquilli: un giorno movimento, un giorno calma.","Pianifica iprendi il registro dell'hobby: vedere i progressi fa tornare la voglia.","Torna nella natura per un'ora: il gioco più semplice è camminare curiosi.","Se ti senti bloccato, prova il gioco libero: niente regole, solo esplorare.","Riparti con la famiglia: un gioco da tavolo dopo cena rimette in moto.","Pianifica il viaggio breve che rimandi: fissa una data sul calendario.","Torna al museo e guarda solo tre opere, con calma.","Ricomincia con uno sport nuovo, scelto solo per il piacere di provarlo.","La pausa è parte del gioco: anche fermarsi fa parte della partita.","Ogni ritorno è festa: non serve spiegare perché eri sparito."],"M":["La giornata di esplorazione nel weekend.","Segna sul calendario gli eventi della tua passione appena li scopri.","Concediti qualche minuto di gioco libero ogni giorno, anche da adulto.","Programma un viaggio breve a ogni cambio di stagione.","Tieni i musei per i giorni di pioggia: diventano un'avventura al riparo.","Nei giorni di sole porta il gioco all'aperto.","Lo sport per divertimento sta bene nel tempo libero del weekend.","I giochi di strategia rendono di più la sera, a mente tranquilla.","La domenica è il giorno naturale dei giochi in famiglia.","Il pomeriggio tranquillo è perfetto per i lavori manuali.","Aggiorna il registro subito dopo ogni sessione: bastano due righe.","Condividi le scoperte nel gruppo: moltiplica il piacere.","Nei giorni pieni tieni pronto il piano B da cinque minuti.","Durante la settimana alterna giochi attivi e tranquilli.","Il momento fisso del gioco resta la radice di tutto il resto."]},{"S":["Ogni mese rivedi cosa ti diverte davvero.","Pianifica un'esperienza straordinaria all'anno.","Approfondisci un hobby fino a sentirti esperto.","Organizza un evento per gli altri: una serata giochi, una caccia al tesoro.","Insegna il tuo hobby a qualcuno: vedrai la tua passione con occhi nuovi.","Crea una collezione o un archivio di ciò che hai fatto e scoperto.","Partecipa a una competizione amichevole.","Viaggia per  il tuo modo di respirare.","Ricorda la serietà dei primi giorni.","Il gioco nutre tutte le altre aree: rende più creativi, pazienti, sereni.","Su questa base puoi tentare un'avventura grande.","Rinnova i giochi ogni tanto, perché la curiosità resti viva.","La leggerezza è saggezza: sa prendere sul serio solo ciò che lo merita.","Più giochi, più vivi: il tempo del gioco è tempo pieno.","Non smettere di essere curioso, nemmeno quando sai già tanto.","Celebra la tua gioia: è un segno che stai vivendo bene.","Ogni anno regalati almeno una nuova avventura.","Il fuoco fatuo è diventato una costellazione di ricordi.","Ispira gli altri a giocare: il tuo esempio dà il permesso di farlo.","La tua esperienza di gioco è preziosa per chi ha dimenticato come si fa.","Il gioco include anche il riposo: non tutto deve essere avventura.","La meraviglia è la tua bussola: seguila e non sbagli strada."],"R":["Anche all'orizzonte capitano periodi seri: riparti da un gioco breve.","Dopo un periodo difficile, leggerezza.","Un cambio di vita apre nuovi giochi.","La mente ricorda la gioia del gioco: basta poco per risvegliarla.","Una vacanza è occasione di avventura.","Dopo una perdita, il gioco tranquillo consola.","Se perdi il ritmo, torna al gioco quotidiano.","Torna alla lista delle esperienze e scegline una per questo mese.","Riprendi il diario delle avventure dal punto in cui l'avevi lasciato.","Non devi giocare come prima: scegli il gioco che ti somiglia adesso.","Ogni ritorno porta meraviglia: guardalo come la prima volta.","Se sei triste, gioca con chi ami: la leggerezza condivisa consola.","Ricomincia esplorando un posto vicino che non conosci.","Il gioco aspetta sempre, paziente, che tu torni.","La luce del fuoco fatuo danza ancora: devi solo alzare lo sguardo."],"M":["L'estate invita alle avventure all'aperto.","L'inverno invita ai giochi al chiuso: tavolo, carte, costruzioni.","Riserva un giorno al mese all'avventura, anche piccola.","Il momento giusto per una grande avventura è quando le basi reggono.","Ogni anno rivedi ciò che ti diverte.","Prima di un cambiamento importante, gioca: aiuta a scaricare la tensione.","Nei periodi intensi tieni almeno il gioco minimo da cinque minuti.","A fine anno, il bilancio delle avventure.","Quando sei ispirato da un'idea di viaggio, parti appena puoi.","In primavera esplora: sentieri, parchi, quartieri che rifioriscono.","In autunno torna ai giochi di casa e ai lavori manuali.","Ogni compleanno, un'esperienza nuova.","Durante le feste, giochi in famiglia.","Quando la vita rallenta, gioca di più.","Dopo un traguardo, festeggia giocando."]}]};

document.addEventListener("touchstart",e=>{mode=null;if(e.touches.length>1)return;const p=e.touches[0];sx=lx=p.clientX;sy=ly=p.clientY;t0=Date.now();el=e.target.closest&&e.target.closest(".scrim .sheet,.w3.legon .leg3")},{passive:true});
document.addEventListener("touchmove",e=>{if(e.touches.length>1)return;const p=e.touches[0];lx=p.clientX;ly=p.clientY;const dx=lx-sx,dy=ly-sy;
 if(!mode){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
  if(el&&dy>0&&Math.abs(dy)>Math.abs(dx)&&el.scrollTop<=0)mode="down";
  else if(Math.abs(dx)>Math.abs(dy)*1.2){let q=e.target,ok=false;while(q&&q!==document.body){const c=getComputedStyle(q);if(/(auto|scroll)/.test(c.overflowX)&&q.scrollWidth>q.clientWidth+1){ok=true;break}q=q.parentElement}
   mode=ok?"h":(dx>0&&backBtn()&&sx<innerWidth*.7)?"back":"block"}
  else{mode="v";let q=e.target,can=false;while(q&&q!==document.body&&q!==document.documentElement){const c=getComputedStyle(q);if(/(auto|scroll)/.test(c.overflowY)&&q.scrollHeight>q.clientHeight+1){can=true;break}q=q.parentElement}
   const se=document.scrollingElement||document.documentElement;if(!can&&se&&se.scrollHeight<=innerHeight+1)mode="block"}}
 if(mode==="down"){e.preventDefault();el.style.transition="none";el.style.transform=sT(el,Math.max(0,dy))}
 else if(mode==="back"){e.preventDefault();const o=ovEl();if(o){o.style.transition="none";o.style.transform=`translateX(${Math.max(0,dx)}px)`;o.style.boxShadow="-12px 0 30px rgba(30,27,75,.12)"}}
 else if(mode==="block")e.preventDefault()},{passive:false});
document.addEventListener("touchend",()=>{const dx=lx-sx,dy=ly-sy,v=(mode==="down"?dy:dx)/Math.max(1,Date.now()-t0);
 if(mode==="down"&&el){const n=el;const go=dy>110||(dy>40&&v>.5);n.style.transition="transform .28s cubic-bezier(.2,.8,.3,1)";
  if(go){const sc=n.closest(".scrim");if(sc){n.style.transform=sT(n,n.offsetHeight);setTimeout(()=>sc.click(),60)}else{n.style.transform="";const ls=document.querySelector(".w3 .lscrim");if(ls)ls.click()}}
  else n.style.transform="";setTimeout(()=>{n.style.transition=""},320)}
 if(mode==="back"){const o=ovEl();const b=backBtn();const go=dx>innerWidth*.3||(dx>40&&v>.5);if(o){o.style.transition="transform .25s cubic-bezier(.2,.8,.3,1)";
  if(go&&b){o.style.transform=`translateX(${innerWidth}px)`;setTimeout(()=>{b.click();const o2=ovEl();if(o2){o2.style.transition="none";o2.style.transform="";o2.style.boxShadow=""}},200)}
  else{o.style.transform="";setTimeout(()=>{o.style.transition="";o.style.boxShadow=""},260)}}}
 mode=null;el=null},{passive:true});
document.addEventListener("touchcancel",()=>{const o=ovEl();if(o){o.style.transform="";o.style.boxShadow=""}if(el)el.style.transform="";mode=null;el=null},{passive:true});
})();

<script>/* aggiornamento automatico: se su GitHub c'è una versione nuova, la carica */
(function(){const BUILD='2026-10-25c';let busy=false;
async function chk(){if(busy||!navigator.onLine)return;busy=true;try{
 const r=await fetch('index.html?u='+Date.now(),{cache:'no-store'});const s=await r.text();
 const m=s.match(/const BUILD='([^']+)'/);
 if(m&&m[1]!==BUILD){let n=0;try{n=+sessionStorage.getItem('upd_'+m[1])||0;sessionStorage.setItem('upd_'+m[1],n+1)}catch(_){}
  if(n<2)location.replace(location.pathname+'?v='+m[1]+location.hash)}
}catch(_){}busy=false}
addEventListener('load',()=>setTimeout(chk,800));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});
})();
</script>

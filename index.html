<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Step by Step</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Step by Step">
<meta name="theme-color" content="#fdfcff">
<style>
/* Mobile app, lavender style. Guides are intact 2D illustrations that move as a whole. */
:root{
  --bg1:#e6dcff;--bg2:#f4efff;--bg3:#ffffff;
  --ink:#1d1830;--mut:#6e6789;--soft:#a39cb8;--line:#ece6f7;--tint:#f7f4fe;
  --v1:#7b5cf0;--v2:#5b3fd6;--vio:#6d4fe0;--vbg:#efe9ff;
  --ok:#2a9a66;--ok-bg:#e8f7ef;--warn:#b8701f;--warn-bg:#fff3e2;
  --f:"Urbanist",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh:0 4px 14px rgba(90,60,180,.07);
  --cta:linear-gradient(180deg,var(--v1),var(--v2));
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 34%,var(--bg3) 78%) fixed;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--vio) 45%,transparent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}p{margin:0}
.app{max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(108px + env(safe-area-inset-bottom,0px))}
/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top .dt{font-size:14px;color:var(--mut);font-weight:500}.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:30px;background:#fff;box-shadow:var(--sh);font-weight:700;font-size:14px;white-space:nowrap}
.lvr{--p:0%;width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--vio) 0 var(--p),#ece7f6 var(--p) 100%);display:grid;place-items:center}.lvr b{width:17px;height:17px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:10.5px;color:var(--vio)}
/* stage: halo + intact figure + particles */
.stage{position:relative;height:var(--h,300px);--aura:0;isolation:isolate}
.halo{position:absolute;left:50%;top:50%;width:min(calc(var(--h,300px)*.96),94%);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-52%);background:radial-gradient(circle at 50% 45%,#efe8ff 0,#e7defb 68%,#e2d7fa 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.halo::after{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent) 0,transparent 66%);opacity:var(--aura);transition:opacity .8s}
.stage[data-base="explain"] .halo::after{animation:aurap 2.4s ease-in-out infinite}
.stage[data-base="focus"] .halo::after{opacity:calc(var(--aura) + .12);inset:6%}
@keyframes aurap{50%{opacity:calc(var(--aura) + .16)}}
.fig{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:var(--fb,5%);height:var(--fh,84%);z-index:1}
.fig::before{content:"";position:absolute;left:12%;right:12%;bottom:-3%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(70,40,140,.22),transparent);z-index:-1}
.shot,.pose,.br{height:100%;transform-origin:50% 100%}
.pose{transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.fig img{height:100%;width:auto;display:block;user-select:none;-webkit-user-drag:none}
.fig.cardf .br{aspect-ratio:940/1011}
.fig.cardf img{width:100%;height:100%;object-fit:cover;border-radius:9%/8.4%;box-shadow:0 14px 30px rgba(50,30,110,.25),0 0 0 3px #fff}
.br{animation:breath 3.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(1.004,1.012) rotate(.8deg)}50%{transform:scale(1,1.002) rotate(0)}75%{transform:scale(1.004,1.012) rotate(-.8deg)}}
.stage[data-base="listen"] .pose{transform:rotate(-3deg)}.stage[data-base="listen"] .br{animation-duration:5s}
.stage[data-base="explain"] .br{animation:rock 2.4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.stage[data-base="focus"] .pose{transform:translateY(1%)}.stage[data-base="focus"] .br{animation:breathf 6s ease-in-out infinite}
@keyframes breathf{50%{transform:scale(1.002,1.008)}}
.pfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.stage.still .br,.rmode .br{animation:none!important}.rmode .halo::after{animation:none!important}
/* guide line */
.line{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:var(--sh);font-size:15.5px;line-height:1.45;color:#3b3550;margin-top:4px}
.line b{color:var(--ink)}.line .nm{font-weight:700;color:var(--vio);margin-right:4px}
/* buttons */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:14px 22px;border-radius:30px;background:var(--cta);color:#fff;font-weight:600;font-size:17px;box-shadow:0 10px 24px rgba(91,63,214,.35);transition:transform .15s}
.cta:active{transform:scale(.98)}.cta[disabled]{opacity:.4;box-shadow:none;cursor:default}
.ghost{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 18px;border-radius:28px;background:#fff;color:var(--vio);font-weight:600;font-size:16px;box-shadow:var(--sh)}
.lnk{color:var(--vio);font-weight:600;font-size:15px;padding:10px 4px;text-decoration:underline;text-underline-offset:3px}
.lnk.mut{color:var(--mut)}.lnk.del{color:#c0384b}
.row2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px;margin-top:12px}
/* segmented filter */
.seg{display:flex;background:#fff;border-radius:30px;padding:4px;gap:2px;box-shadow:var(--sh)}
.seg button{flex:1;padding:9px 4px;border-radius:24px;font-weight:600;font-size:14.5px;color:var(--mut)}
.seg button[aria-selected="true"]{background:var(--cta);color:#fff;box-shadow:0 4px 12px rgba(91,63,214,.3)}
.seg i{font-style:normal;font-size:12px;opacity:.8;margin-left:3px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}.sec b{font-size:19px;font-weight:700}.sec span{font-size:13.5px;color:var(--mut)}
/* habit rows */
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.hr{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 12px 10px 10px;box-shadow:var(--sh);min-height:72px}
.hr .ht{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:12px}
.th{width:52px;height:56px;flex:none;border-radius:14px;background:#e9e2fb center/cover no-repeat;box-shadow:0 0 0 2px #fff,0 3px 8px rgba(60,30,120,.16)}
.hr b{display:block;font-size:16.5px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr small{display:block;font-size:13.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{display:flex;gap:3px;margin-top:6px}.bd i{width:16px;height:4px;border-radius:2px;background:#ece7f6}.bd i.on{background:var(--c)}
.ck{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid #d9d1ee;display:grid;place-items:center;color:transparent;font-size:19px;font-weight:700;transition:background .2s,border-color .2s}
.ck[aria-pressed="true"]{background:var(--c,var(--vio));border-color:var(--c,var(--vio));color:#fff}
.ck.p{border-style:dashed;color:var(--soft);font-size:15px}
.ck[disabled]{opacity:.45;cursor:default}
.hr.dn b{color:var(--soft);text-decoration:line-through}.hr.busy{opacity:.6}
.big{padding:14px;gap:14px}.big .th{width:66px;height:72px}.big b{font-size:19px;white-space:normal}
.then{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:14px 4px 0}
.empty{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh);color:var(--mut);font-size:15.5px;text-align:center}
/* week */
.wk{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wd{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:start;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:var(--sh)}
.wd.on{box-shadow:0 0 0 2px var(--vio),var(--sh)}.wd.past{opacity:.75}
.wd .dl{font-size:13px;color:var(--mut);font-weight:600;line-height:1.1}.wd .dl b{display:block;font-size:22px;color:var(--ink);font-weight:600}
.wq{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#fff);font-size:13px;font-weight:600;border-left:3px solid var(--c)}
.tg.dn{text-decoration:line-through;color:var(--soft)}.tg.bz{background:#f1eef6;border-left-color:#cfc8dc;color:var(--mut)}
.wsum{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin:12px 4px 0}.wsum b{color:var(--ink)}
/* tab bar */
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(90,60,180,.08)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--soft);padding:4px 0;min-height:48px;justify-content:center}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--vio)}
.tabs .plus{position:relative;top:-14px}
.tabs .plus span{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#8ff7ff,#00e5ff 22%,#8a5bff 62%,#ff3ec8);box-shadow:0 0 0 4px #fff,0 0 22px rgba(0,229,255,.55),0 0 40px rgba(155,91,255,.45);animation:neon 2.6s ease-in-out infinite}
.tabs .plus span svg{width:28px;height:28px;color:#fff}
@keyframes neon{50%{box-shadow:0 0 0 4px #fff,0 0 28px rgba(255,62,200,.55),0 0 50px rgba(0,229,255,.5)}}
/* overlays */
.ov{position:fixed;inset:0;z-index:60;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 34%,var(--bg3) 78%);animation:fin .25s ease-out}
@keyframes fin{from{opacity:0}}
.ovin{max-width:480px;min-height:100%;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.nav{display:flex;align-items:center;gap:14px;min-height:52px}
.back{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh);flex:none}.back svg{width:20px;height:20px}
.prog{flex:1;height:6px;border-radius:4px;background:#fff;overflow:hidden}.prog i{display:block;height:100%;border-radius:4px;background:var(--vio);transition:width .35s}
.kick{text-align:center;color:var(--vio);font-weight:600;font-size:17px;margin-top:6px}
.foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
/* onboarding */
.q{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:14px 2px 6px}
.qs{color:var(--mut);font-size:15.5px;margin:0 2px 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.g2{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);border:2px solid transparent;min-height:64px}
.opt .ic{width:42px;height:42px;flex:none;border-radius:50%;background:var(--vbg);display:grid;place-items:center;color:var(--vio)}.opt .ic svg{width:22px;height:22px}
.opt b{display:block;font-size:16px;font-weight:700}.opt small{display:block;font-size:13px;color:var(--mut);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--vio);background:#fbf9ff}
.opt .tk{margin-left:auto;width:24px;height:24px;flex:none;border-radius:50%;border:2px solid #ddd5f0;display:grid;place-items:center;font-size:13px;color:transparent}
.opt[aria-pressed="true"] .tk{background:var(--vio);border-color:var(--vio);color:#fff}
.opts.g2 .opt{flex-direction:column;align-items:flex-start;gap:6px;min-height:0;padding:12px}.opts.g2 .opt .tk{position:absolute;top:10px;right:10px}.opts.g2 .opt{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 15px;border-radius:24px;background:#fff;box-shadow:var(--sh);font-weight:600;font-size:15px;border:2px solid transparent;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--vio);color:var(--vio);background:#fbf9ff}
.lb{font-size:14px;font-weight:700;color:var(--mut);margin:18px 2px 8px}
.days{display:flex;gap:6px;justify-content:space-between}.days button{flex:1;max-width:48px;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:var(--sh);font-weight:700;border:2px solid transparent}.days button[aria-pressed="true"]{background:var(--vio);color:#fff}
.addc{display:flex;gap:6px;margin-top:10px}.addc input,.addc select{font:inherit;font-size:16px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);min-width:0}.addc input{flex:1}
.known{margin-top:16px;background:rgba(255,255,255,.65);border-radius:16px;padding:10px 14px;font-size:13.5px;color:var(--mut)}.known b{color:var(--ink);font-weight:600}
/* welcome */
.trio{position:relative;height:300px;margin-top:10px}
.trio>.s0,.trio>.s1,.trio>.s2{position:absolute;bottom:0;width:58%}.trio .s0{left:-6%;z-index:1}.trio .s1{left:21%;z-index:2}.trio .s2{right:-6%;z-index:1}
.trio .halo{display:none}.trio .bigh{position:absolute;left:50%;top:46%;width:300px;height:300px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 50% 45%,#efe8ff 0,#e7defb 68%,#e2d7fa 100%)}
.wt{font-size:31px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-align:center;margin-top:8px}
.ws{text-align:center;color:var(--mut);font-size:16px;margin-top:8px}
/* proposal */
.pt{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:10px 2px 4px}
.ps{color:var(--mut);font-size:15px;margin:0 2px}
.tbar{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);margin-top:12px}
.tbar .r{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}.tbar .r b{color:var(--ink);font-size:16px}
.bars{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#f1edf8;margin-top:8px}.bars i{display:block;height:100%}
.pr{background:#fff;border-radius:20px;padding:12px;box-shadow:var(--sh)}
.pr .tp{display:flex;gap:12px;align-items:center}.pr .tp div{flex:1;min-width:0}.pr b{display:block;font-size:16.5px;font-weight:700}.pr small{display:block;font-size:13.5px;color:var(--mut)}
.pv{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;font-size:14px;color:var(--mut)}.pv b{display:inline;font-size:15px;color:var(--ink)}
.pd{display:flex;gap:4px;margin-top:10px}.pd i,.pd button{flex:1;max-width:36px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:#f4f1fa;color:#b4adc4}.pd .on{background:var(--c);color:#fff}
.int{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px}.int.leggera{background:var(--ok-bg);color:var(--ok)}.int.media{background:var(--warn-bg);color:var(--warn)}.int.alta{background:#ffe7ea;color:#c0384b}
.stp{display:inline-flex;align-items:center;gap:6px;background:#f6f3fc;border-radius:20px;padding:3px}.stp button{width:34px;height:34px;border-radius:50%;background:#fff;font-weight:700;font-size:18px;box-shadow:0 1px 3px rgba(60,30,120,.12)}.stp b{min-width:42px;text-align:center}
.why{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--sh);margin-top:12px}.why h3{font-size:17px;font-weight:700}.why ul{margin:8px 0 0;padding-left:18px;font-size:15px;line-height:1.45;color:#3b3550}.why li{margin-bottom:6px}.why li b{color:var(--ink)}
.rm{margin-left:auto;color:var(--soft);font-size:14px;padding:8px}
/* guide intro */
.gname{text-align:center;font-size:32px;font-weight:800;color:var(--vio);letter-spacing:-.01em;margin-top:2px}
.gfield{text-align:center;color:var(--mut);font-size:15.5px;margin-top:-2px}
.ghead{text-align:center;font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:10px}
.gtip{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-top:14px;border:1px solid #f0ebfa}
.gtip .ic{width:48px;height:48px;flex:none;border-radius:50%;background:var(--vbg);display:grid;place-items:center;color:var(--vio)}.gtip .ic svg{width:24px;height:24px}
.gtip p{font-size:15.5px;line-height:1.4;color:#3b3550}
/* sheet */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(40,25,80,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fin .2s}
.sheet{width:min(480px,100%);max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#f1ebff 0,#fff 46%);border-radius:28px 28px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:#d9d0ee;margin:4px auto 6px}
.sx{display:flex;justify-content:flex-end}.xb{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:15px}
.sh2{font-size:25px;font-weight:700;letter-spacing:-.02em;text-align:center}
.smeta{text-align:center;color:var(--mut);font-size:14.5px;margin-top:2px}
.acts3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:14px}
.acts3 .cta{min-height:52px;font-size:16px}.acts3 .ghost{min-height:52px;font-size:15px;padding:10px}
.choice{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh);margin-top:10px}.choice p{font-size:15px;color:var(--mut);margin:2px 4px 8px}.choice .chips{gap:6px}
.blk{background:#fff;border-radius:18px;padding:13px 15px;box-shadow:var(--sh);margin-top:12px}
.kc{font-size:12px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#2a2040)}
.blk p{margin-top:4px;font-size:15px;color:#3b3550}
.trk{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}.trk div{text-align:center;font-size:10.5px;font-weight:700;color:var(--soft)}.trk i{display:block;height:6px;border-radius:3px;background:#ece7f6;margin-bottom:4px}.trk .on{color:color-mix(in srgb,var(--c) 70%,#2a2040)}.trk .on i{background:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stats div{background:var(--tint);border-radius:14px;padding:8px 4px;text-align:center}.stats b{display:block;font-size:20px}.stats small{font-size:12px;color:var(--mut)}
.hm{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:10px}.hm i{display:block;aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,#fff)}.hm i.f{background:var(--c)}.hm i.m{background:color-mix(in srgb,var(--c) 55%,#fff)}.hm i.n{background:#f5f2fa}
.bar{height:8px;border-radius:5px;background:#f1edf8;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:5px;background:var(--c)}

function stats(h,id){const tS=today();const c0=h.created||tS;let reps=0;const dd=new Set();
  for(const k in S.checks){if(!k.endsWith("__"+id))continue;if(doneV(S.checks[k])){reps++;dd.add(k.slice(0,10))}}

const SPORT=/calc|palestr|cors|nuot|tennis|padel|yoga|pilates|bici|basket|pallavol|danza|arrampic|allenament|sport|crossfit/i;
function genPlan(p,variant){const why=[];const cur=new Set(p.current||[]);const goals=(p.goals||[]).slice(0,3);
  const budget=Math.round((p.weekly||240)*({leggero:.5,consigliato:.95,ambizioso:1.35}[variant]));
  const maxN={leggero:2,consigliato:4,ambizioso:5}[variant];const picks=[];
  const per=variant==="ambizioso"?2:1;
  for(const g of goals){let n=0;for(const k of (GOALS[g]||[,[]])[1]){if(picks.length>=maxN||n>=per)break;if(cur.has(k)||picks.includes(k))continue;picks.push(k);n++}}
  if(variant!=="leggero"&&p.eve==="bassa"&&picks.length<maxN&&!picks.includes("respiro")&&!cur.has("respiro")&&(p.hours||0)>=35)picks.push("respiro");
  if(!picks.length)picks.push(cur.has("camminata")?"lettura":"camminata");
  if(variant!=="leggero"){const est=()=>picks.reduce((a,k)=>a+HC[k].m*HC[k].f,0);for(const g of goals){for(const k of (GOALS[g]||[,[]])[1]){if(picks.length>=maxN||est()+HC[k].m*HC[k].f>budget*1.05)break;if(cur.has(k)||picks.includes(k))continue;picks.push(k);break}}}
  const hours=p.hours||0,heavy=hours>=40,free=(p.free&&p.free.length?p.free:[5,6]),busyDays=new Set((p.commits||[]).map(c=>c.d));
  const sportCommits=(p.commits||[]).filter(c=>SPORT.test(c.t));
  const items=picks.map(k=>{const c=HC[k];let f=c.f,m=c.m,w=c.w;
    if(variant==="leggero"){f=Math.max(1,Math.round(f*.6));m=Math.max(5,Math.round(m*.7/5)*5)}
    if(variant==="ambizioso"){f=Math.min(7,f+1);m=Math.round(m*1.2/5)*5}
    if(c.sport&&sportCommits.length&&f>2)f--;
    if(w==="best")w=p.best||"mattina";if(w==="free")w=p.best==="sera"?"pomeriggio":"mattina";
    if(c.i!=="leggera"&&w==="sera"&&p.eve==="bassa")w=heavy?"mattina":"pomeriggio";
    let pool;if(c.w==="free"||(c.i!=="leggera"&&heavy))pool=[...free,...[0,1,2,3,4,5,6].filter(d=>!free.includes(d))];else pool=[0,1,2,3,4,5,6];
    if(c.i!=="leggera"||c.sport)pool=pool.filter(d=>!busyDays.has(d)).concat(pool.filter(d=>busyDays.has(d)));
    const days=spread(pool,f,c.w==="free"||(c.i!=="leggera"&&heavy));const wk=days.every(d=>d>=5);const anc=(c.w==="best"||c.w==="free"||w!==c.w)?`${wk?"nel weekend, ":""}${w==="mattina"?"di mattina":w==="sera"?"di sera":w==="pranzo"?"in pausa pranzo":"di pomeriggio"}`:c.anc;
    return {k,t:c.t,g:c.g,m,f,w,i:c.i,mini:c.mini,anc,days}});
  let tot=()=>items.reduce((a,x)=>a+x.m*x.f,0);let guard=0;
  while(tot()>budget&&guard++<40){const big=items.slice().sort((a,b)=>b.m*b.f-a.m*a.f)[0];if(big.f>2){big.f--;big.days=big.days.slice(0,big.f)}else if(big.m>10){big.m=Math.max(10,big.m-5)}else if(items.length>1){items.splice(items.indexOf(big),1)}else break}
  if(p.occ){const o={lavoro:"Lavori",studio:"Studi",entrambi:"Studi e lavori",altro:"Le tue giornate sono piene"}[p.occ];why.push(`${o}${hours?` circa <b>${hours} ore</b> a settimana`:""}: il piano sta in <b>${durH(tot())}</b>, sotto le ${durH(p.weekly||240)} che hai indicato.`)}
  if(p.eve==="bassa")why.push(`La sera hai poca energia: lì solo abitudini <b>brevi e calme</b>.`);
  const hard=items.filter(x=>x.i!=="leggera");if(hard.length)why.push(`${cap(hard.map(x=>x.t.toLowerCase()).join(" e "))} ${hard.length>1?"vanno":"va"} ${heavy?`nei <b>giorni più liberi</b> (${free.map(d=>WDL[d]).join(", ")})`:`nel tuo <b>momento migliore</b> (${MOML[p.best||"mattina"]})`}.`);
  if(sportCommits.length&&items.some(x=>HC[x.k]&&HC[x.k].sport))why.push(`Hai già <b>${esc(sportCommits[0].t)}</b>: lo contiamo come movimento, una sessione in meno.`);
  if(cur.size)why.push(`Fai già ${[...cur].map(k=>HC[k]?HC[k].t.toLowerCase():k).slice(0,3).join(", ")}: non lo ripetiamo, lo diamo per acquisito.`);
  return {items,why,total:tot(),budget}}
function spread(pool,f,front){f=Math.min(f,7);if(front)return pool.slice(0,f).sort((a,b)=>a-b);if(f>=7)return [0,1,2,3,4,5,6];if(f===6)return [0,1,2,3,4,6];if(f===5)return [0,1,2,3,4];if(f===4)return [0,1,3,4];if(f===3)return [0,2,4];const out=[];const step=7/f;for(let i=0;i<f;i++){let d=Math.round(i*step)%7;while(out.includes(d))d=(d+1)%7;out.push(d)}return out.sort((a,b)=>a-b)}

  if(recent.has(k)&&now-recent.get(k)<800)return false;recent.set(k,now);

  return topHTML("Il tuo percorso",pl?`Dal ${parse(pl.start).getDate()} ${MESI[parse(pl.start).getMonth()]} · settimana ${weekN()}`:"")+
  `<div class="tbar"><div class="r"><span>Tempo a settimana</span><b>${durH(tot)}${p.weekly?` <span style="color:var(--mut);font-weight:500;font-size:14px">su ${durH(p.weekly)}</span>`:""}</b></div><div class="bars">${L.map(([,h])=>`<i style="width:${tot?h.mins*h.days.length/Math.max(tot,p.weekly||tot)*100:0}%;background:${GD[h.guide].c}"></i>`).join("")}</div></div>
  <div class="tiles2">${(()=>{const mon=addD(new Date(),-wd(new Date()));let sc=0,dn=0;for(let i=0;i<7;i++){const ds=iso(addD(mon,i));if(ds>today())break;for(const [id,h] of H()){if(!sched(h,ds))continue;sc++;if(doneV(chk(ds,id)))dn++}}let all=0;for(const k in S.checks)if(doneV(S.checks[k]))all++;return `<div class="tile y"><span class="ar">↗</span><small>Costanza<br>della settimana</small><b>${sc?Math.round(dn/sc*100):0}%</b></div><div class="tile p"><span class="ar">↗</span><small>Volte fatte<br>in tutto</small><b>${all}</b></div>`})()}</div>
  <div class="panel">${L.length?L.map(([id,h])=>`<button class="pl" data-open="${id}" style="width:100%;text-align:left">${thumb(h.guide,stats(h,id).stage)}<div><b>${esc(h.title)}</b><small>${h.days.length}× a settimana · ${dur(h.mins)} · ${h.days.map(d=>WDL[d]).join(" ")}</small></div></button>`).join(""):`<p style="color:var(--mut)">Nessuna abitudine.</p>`}</div>
  ${pl&&weekN()<=2?`<div class="panel" style="font-size:15px;color:#3b3550"><b>Fase di avvio.</b> Le prime 2 settimane le durate sono al 60%: dalla terza si sale da sole.</div>`:""}
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px"><button class="cta" data-replan>Modifica il percorso</button><button class="ghost" data-onb>Rifai le domande</button></div>`}

function tuHTML(){const xp=xpAll(),L=levelOf(xp);const pct=Math.round((xp-L.prev)/(L.next-L.prev)*100);let tot=0;for(const k in S.checks)if(doneV(S.checks[k]))tot++;
  const tds=Object.entries(S.todos).filter(([,t])=>t).sort((a,b)=>(a[1].done-b[1].done)||String(a[1].due||"9").localeCompare(String(b[1].due||"9")));
  return topHTML("Tu","")+`<div class="panel"><div class="lvbig"><span class="lvr" style="--p:${pct}%"><b>${L.n}</b></span><div><h2>${L.name}</h2><small>${xp} XP · ${L.next-xp} al livello ${L.n+1}</small></div></div>
   <div class="stats"><div><b>${dayStreak()}</b><small>giorni di fila</small></div><div><b>${tot}</b><small>volte fatte</small></div><div><b>${H().length}</b><small>abitudini</small></div></div></div>
  <div class="sec"><b>Da fare</b><span>cose da fare una volta</span></div><div class="panel">${tds.length?tds.map(([id,t])=>`<div class="td ${t.done?"dn":""}"><button class="ck" style="--c:var(--vio)" data-todo="${id}" aria-pressed="${!!t.done}" aria-label="Fatto">✓</button><div>${esc(t.title)}${t.due?`<small>entro ${parse(t.due).getDate()} ${MESI[parse(t.due).getMonth()].slice(0,3)}</small>`:""}</div><button class="x" data-tdel="${id}" aria-label="Elimina">✕</button></div>`).join(""):`<p style="color:var(--mut);font-size:15px">Niente in sospeso.</p>`}
</div>
  <div class="sec"><b>Impostazioni</b><span></span></div><div class="panel">${S.mode==="cloud"?`<button class="mv3" data-exp><b>Porta i dati nell'app a schermo intero</b><small>Li copio negli appunti: poi nell'altra app tocchi «Incolla i miei dati».</small></button>`:`<button class="mv3" data-imp><b>Incolla i miei dati</b><small>Porta qui il percorso copiato dall'altra versione.</small></button>`}<div class="sw"><span>Movimento ridotto</span><button role="switch" aria-checked="${RM}" data-rmt aria-label="Movimento ridotto"></button></div></div>`}

  if(st===7){const tot=genPlan(p,p.pace||"consigliato").total;const wk=p.weekly||240;const sera={alta:45,media:30,bassa:15}[p.eve]||30;const we=(p.free||[]).some(d=>d>=5)?"2 ore":"1 ora";

function openProposal(cur){const p=meta().profile;OV={kind:"prop",variant:p?p.pace||"consigliato":"consigliato",edit:!!cur,cur:!!cur,own:false,items:null,why:[]};
  if(cur)OV.items=H().map(([id,h])=>({id,k:null,t:h.title,g:h.guide,m:h.mins,f:h.days.length,w:h.when,i:h.i||"leggera",mini:h.mini,anc:h.anchor,days:h.days.slice()}));else regen();drawProp()}
function regen(){const r=genPlan(meta().profile||{},OV.variant);OV.items=r.items;OV.why=r.why}
function drawProp(){const m=OV,p=meta().profile||{};const it=m.items||[];const tot=it.reduce((a,x)=>a+x.m*x.f,0);
  const rows=it.map((x,i)=>{const c=GD[x.g].c;return `<div class="pr" style="--c:${c}"><div class="tp">${thumb(x.g,1)}<div><b>${esc(x.t)}</b><small>${esc(cap(x.anc||MOML[x.w]))}</small></div>${m.edit?`<button class="rm" data-prm="${i}" aria-label="Togli ${esc(x.t)}">✕</button>`:""}</div>
    ${m.edit?`<div class="edrow"><span>Volte a settimana</span><span class="stp"><button data-pf="${i}:-1" aria-label="Meno volte">−</button><b>${x.f}×</b><button data-pf="${i}:1" aria-label="Più volte">+</button></span></div><div class="edrow"><span>Minuti per volta</span><span class="stp"><button data-pm="${i}:-5" aria-label="Meno minuti">−</button><b>${x.m}′</b><button data-pm="${i}:5" aria-label="Più minuti">+</button></span></div>`
      :`<div class="pv"><span><b>${x.f}×</b> a settimana</span><span><b>${dur(x.m)}</b> per volta</span><span class="int ${x.i}">${x.i}</span></div>`}
    <div class="pd">${WDS.map((w,d)=>m.edit?`<button data-pday="${i}:${d}" class="${x.days.includes(d)?"on":""}" aria-label="${WDL[d]}" aria-pressed="${x.days.includes(d)}">${w}</button>`:`<i class="${x.days.includes(d)?"on":""}">${w}</i>`).join("")}</div></div>`}).join("");
  const cat=m.edit?`<div class="lb">Aggiungi un'abitudine</div><div class="chips">${Object.entries(HC).filter(([k,c])=>!it.some(x=>x.t===c.t)).map(([k,c])=>`<button class="chip" data-padd="${k}">+ ${c.t}</button>`).join("")}</div>`:"";

   <h1 class="pt">${m.cur?"Modifica il percorso":m.own?"Componi il tuo":"Il tuo percorso"}</h1><p class="ps">${m.cur?"Cambia volte, minuti e giorni, o aggiungi un'abitudine.":"Un piano già pronto che sta nella tua settimana."}</p>
   ${m.cur||m.own?"":`<div class="seg" role="tablist" style="margin-top:14px">${[["leggero","Leggero"],["consigliato","Consigliato"],["ambizioso","Ambizioso"]].map(([v,l])=>`<button role="tab" data-var="${v}" aria-selected="${m.variant===v}">${l}<i>${vt(v)}</i></button>`).join("")}</div>`}
   <div class="tbar"><div class="r"><span>${it.length} abitudini · ${new Set(it.map(x=>x.g)).size} guide</span><b>${durH(tot)}${p.weekly?` <span style="color:var(--mut);font-weight:500;font-size:14px">su ${durH(p.weekly)}</span>`:""}</b></div><div class="bars">${it.map(x=>`<i style="width:${tot?x.m*x.f/Math.max(tot,p.weekly||tot)*100:0}%;background:${GD[x.g].c}"></i>`).join("")}</div></div>
   <div class="list">${rows||`<div class="empty">Scegli le abitudini qui sotto.</div>`}</div>${cat}

   <div class="foot"><button class="cta" data-pgo ${it.length?"":"disabled"}>${m.cur?"Salva il percorso":"Inizia questo percorso"}</button>${m.edit?"":`<button class="lnk" data-pedit>Modifica o componi il tuo</button>`}</div>`)}
function applyPlan(){const m=OV;const tS=today();const keep=new Set();const before=new Set(H().map(([,h])=>figOf(h.guide)));
  for(const x of m.items){let id=x.id;const ex=id?S.habits[id]:Object.entries(S.habits).find(([,h])=>h&&!h.archived&&h.title===x.t);if(!id&&ex)id=ex[0];
    const base=id&&S.habits[id]?S.habits[id]:{created:tS,stage:1};id=id||uid();keep.add(id);
    save("habits",id,{...base,title:x.t,guide:x.g,mins:x.m,days:x.days.slice().sort(),when:x.w,i:x.i,mini:base.mini||x.mini,anchor:base.anchor||x.anc,plan:true,archived:false})}
  if(m.cur)for(const [id,h] of H())if(!keep.has(id))save("habits",id,{...h,archived:true});
  const twd=wd(new Date());if(!m.cur&&!H().some(([id,h])=>(h.days||[]).includes(twd))){const L=H().filter(([id,h])=>(h.i||"leggera")==="leggera");const pick=(L[0]||H()[0]);if(pick){const [id,h]=pick;const dd=h.days.slice();dd.splice(dd.length-1,1,twd);save("habits",id,{...h,days:[...new Set(dd)].sort()})}}
  const pl=meta().plan;setMeta({plan:{start:pl&&pl.start?pl.start:tS,variant:m.variant},onboarded:true});
  const newG=[...new Set(H().map(([,h])=>figOf(h.guide)))].filter(g=>!before.has(g));
  if(newG.length){openIntros(newG)}else{OV=null;$("#ov").innerHTML="";S.tab="oggi";render();snack(m.cur?"Percorso aggiornato":"Il percorso è pronto")}}

const pickDays=(pat,f)=>{f=Math.max(1,Math.min(pat.length,f));if(f===pat.length)return pat.slice();const t=wd(new Date());let k=pat.findIndex(x=>x>=t);if(k<0)k=0;const r=pat.slice(k).concat(pat.slice(0,k));const step=r.length/f;const out=[];for(let i=0;i<f;i++)out.push(r[Math.floor(i*step)]);return [...new Set(out)].sort((a,b)=>a-b)};

  let g=0;while(tot()>T&&g++<400){const big=T2.slice().sort((a,b)=>b.m*b.f-a.m*a.f)[0];if(!big)break;
    if(big.f>1&&(big.f>2||big.m<=5))big.f--;else if(big.m>5)big.m-=5;else{const c=T2.filter(x=>x.f>1).sort((a,b)=>b.f-a.f)[0];if(c)c.f--;else break}}
  g=0;while(g++<400){const c=T2.slice().sort((a,b)=>a.m/ACT[a.id].m-b.m/ACT[b.id].m)[0];if(!c)break;if(c.f<D&&kind!=="scintilla"&&tot()+c.m<=T){c.f++;continue}if(c.m+5<=ACT[c.id].m*P.mx&&tot()+5*c.f<=T){c.m+=5;continue}break}

 {n:"Orizzonte",acts:4,min:40,days:5,win:14,need:12,d:"Le abitudini reggono da sole: spazio a una nuova area.",img:"percorso_orizzonte.webp"}];

function pathStats(){const pc=meta().percorso||{};const tS=today();const created=H().map(([,h])=>h.created).filter(Boolean).sort();const start=[pc.start,created[0]].filter(Boolean).sort()[0]||tS;
  const span=Math.min(84,Math.max(1,daysBetween(start,tS)+1));const D=[];for(let i=span-1;i>=0;i--){const ds=iso(addD(new Date(),-i));const L=dayList(ds);let dn=0,mi=0;for(const [id] of L){const c=chk(ds,id);if(doneV(c)){dn++;if(c.v==="m")mi++}}D.push({ds,sc:L.length,dn,mi,w:wd(parse(ds)),L})}
  let cur=0;for(let i=D.length-1;i>=0;i--){const d=D[i];if(!d.sc)continue;if(d.dn){cur++;continue}if(d.ds===tS)continue;break}
  let best=0,run=0;for(const d of D){if(!d.sc)continue;if(d.dn){run++;best=Math.max(best,run)}else if(d.ds!==tS)run=0}
  const act30=D.slice(-30).filter(d=>d.dn).length;const tot=D.reduce((s,d)=>s+d.sc,0),dn=D.reduce((s,d)=>s+d.dn,0),mi=D.reduce((s,d)=>s+d.mi,0);
  const wk=[0,0,0,0,0,0,0].map(()=>({sc:0,dn:0}));const mo={mattina:{sc:0,dn:0},pranzo:{sc:0,dn:0},pomeriggio:{sc:0,dn:0},sera:{sc:0,dn:0}};const ar={};
  for(const d of D){wk[d.w].sc+=d.sc;wk[d.w].dn+=d.dn;for(const [id,h] of d.L){const m=mo[h.when||"mattina"];m.sc++;const ok=doneV(chk(d.ds,id));if(ok)m.dn++;const f=figOf(h.guide);ar[f]=ar[f]||{sc:0,dn:0};ar[f].sc++;if(ok)ar[f].dn++}}
  const weeks=[];const mon=addD(new Date(),-wd(new Date()));for(let k=7;k>=0;k--){let sc=0,d2=0;for(let i=0;i<7;i++){const ds=iso(addD(mon,i-7*k));const x=D.find(z=>z.ds===ds);if(x){sc+=x.sc;d2+=x.dn}}weeks.push({k,sc,dn:d2})}
  return {start,D,cur,best,act30,tot,dn,mi,wk,mo,ar,weeks}}

  return `<div class="wg5"><div class="wg5n"><button class="rb3" data-cweek="-7" aria-label="Settimana precedente">${icon("back",1.8)}</button><b>${parse(days[0]).getDate()} – ${parse(days[6]).getDate()} ${MESI[parse(days[6]).getMonth()]}</b><button class="rb3 nx" data-cweek="7" aria-label="Settimana successiva">${icon("back",1.8)}</button></div>
   <div class="wl5">${cards}</div><p class="wg5s"><span>Fatte <b>${dn} di ${tot}</b></span><span><b>${durH(mins)}</b> dedicati</span></p></div>`}
function tappaRing(cur,cp){const R=40,C=52,N=5,gap=12,seg=(360-N*gap)/N;const pt=a=>{const r=(a-90)*Math.PI/180;return [C+R*Math.cos(r),C+R*Math.sin(r)]};
  const arc=(a0,a1)=>{const [x0,y0]=pt(a0),[x1,y1]=pt(a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`};let s="";
  for(let i=0;i<N;i++){const a0=i*(seg+gap)+gap/2;s+=`<path d="${arc(a0,a0+seg)}" class="rb"/>`;const fr=i<cur?1:i===cur?Math.max(.05,cp):0;if(fr>0)s+=`<path d="${arc(a0,a0+seg*fr)}" class="rf ${i===cur?"now":""}"/>`}
  return `<svg viewBox="0 0 104 104" aria-hidden="true">${s}</svg>`}
function tappaCardHome(){const pc=meta().percorso;if(!pc||pc.tappa==null)return "";const T=TAPPE[pc.tappa];const tS=today();let done=0;
  for(let i=0;i<T.win;i++){const ds=iso(addD(parse(pc.start),i));if(ds>tS)break;for(const k in S.checks)if(k.startsWith(ds+"__")&&doneV(S.checks[k])){done++;break}}
  const left=Math.max(0,T.need-done);const cp=Math.min(1,done/T.need);
  return `<button class="o5home t5" data-path aria-label="Apri le statistiche del percorso"><div class="t5r">${tappaRing(pc.tappa,cp)}<span class="t5c"><b>${pc.tappa+1}</b><small>di 5</small></span></div><div class="t5t"><span class="t5k">Il tuo percorso</span><b>${T.n}</b><span class="t5n">${TAPPE.map((x,i)=>`<i class="${i<pc.tappa?"ok":i===pc.tappa?"on":""}" title="${x.n}"></i>`).join("")}</span><p>${done} di ${T.need} giorni fatti · ${TAPPE[pc.tappa+1]?(left?`ancora ${left} per ${TAPPE[pc.tappa+1].n}`:`pronto per ${TAPPE[pc.tappa+1].n}`):"ultima tappa"}</p></div><span class="t5go">${icon("l3chev",1.5)}</span></button>`}

const TIPS={"Aster":[{"S":["Lascia un libro sul cuscino: la sera lo troverai prima del telefono.","Scegli un libro che desideri davvero leggere, non quello che «dovresti».","Lega la lettura a un gesto: dopo esserti lavato i denti, una pagina.","Tieni un segnalibro bello: rende il ritorno al libro un piccolo piacere.","Porta sempre con te un libro tascabile o un e-reader.","Crea un angolo di lettura con una luce calda.","Metti il telefono in carica fuori dalla camera.","Decidi una quantità minima: una pagina, non un capitolo.","Tieni una matita accanto al libro per sottolineare.","Scegli libri brevi all'inizio: finire dà slancio.","Togli dal comodino tutto tranne il libro.","Scarica un audiolibro per i momenti in cui non puoi leggere.","Scrivi su un foglietto il titolo che stai leggendo e appendilo.","Iscriviti alla biblioteca di quartiere: i libri in prestito chiamano.","Tieni una lista di libri da leggere sul telefono."],"C":["Una pagina al giorno, in un anno, è un libro intero.","Leggere è un appuntamento con te stesso.","Non serve leggere tanto: serve leggere spesso.","Ogni pagina è una piccola stella che si accende.","Abbandonare un libro che non ti piace è permesso.","Conta i giorni in cui leggi, non le pagine.","Leggere prima di dormire calma la mente.","Lascia che la storia ti porti: non è un compito.","Ogni libro finito è una costellazione nuova.","La lettura regolare allena la concentrazione.","Anche dieci minuti ti portano in un altro mondo.","Leggere poco ogni giorno batte leggere tanto ogni tanto.","Celebra ogni libro finito con un piccolo rito.","Leggere ti rende una persona che legge.","Il desiderio di sapere come finisce è il tuo alleato."],"R":["Saltato un giorno? Leggi una sola riga oggi: il filo si riannoda.","Non ricominciare il libro: riprendi dal segnalibro.","Se il libro ti annoia, cambialo senza sensi di colpa.","Un periodo senza leggere capita: un racconto breve rimette in moto.","Se sei stanco, ascolta un audiolibro.","Riparti con un libro facile e piacevole.","Rileggi un libro che hai amato: ritrovare una storia nota riaccende il piacere.","Mai saltare due sere di fila: anche una pagina tiene viva l'abitudine.","Se hai perso il filo della storia, rileggi l'ultimo capitolo.","Riprendi la lettura in un posto nuovo: un parco, un caffè.","Lascia il telefono in un'altra stanza per una sera.","Ricomincia con una poesia al giorno.","Se la mente è agitata, leggi ad alta voce.","Un libro di racconti ti aiuta a ripartire in piccolo.","Ogni ritorno alla lettura è un rientro a casa."],"M":["Leggi prima di dormire, ma su carta: lo schermo ruba il sonno.","Dieci minuti in attesa di qualcosa sono perfetti per una pagina.","La mattina presto, con il caffè, la lettura è un rito sereno.","Leggi durante il tragitto se usi i mezzi pubblici.","La pausa pranzo può essere un piccolo rifugio di pagine.","Leggi a letto alla stessa ora ogni sera.","Il weekend regala tempi lunghi per le storie.","Nelle sere d'inverno la lettura è una coperta.","In estate leggi all'aperto, all'ombra: il libro diventa una piccola vacanza.","Dopo una giornata difficile, un romanzo ti porta lontano.","Prima di accendere la TV, leggi dieci pagine.","Durante i viaggi, scegli libri ambientati nei luoghi che visiti.","Nelle sale d'attesa porta sempre un libro.","La domenica mattina è perfetta per un capitolo lungo.","Leggi quando la casa è silenziosa, prima che si svegli o dopo che si addormenta."]},{"S":["Due gesti fissi: leggere a letto e annotare una frase che ti ha colpito.","Tieni un quaderno delle citazioni: le frasi che ti colpiscono diventano stelle fisse.","Crea una pila «prossimi libri» in vista.","Alterna narrativa e saggistica: una nutre l'immaginazione, l'altra il pensiero.","Usa un'app o un quaderno per segnare i libri letti.","Imposta un obiettivo annuale modesto.","Tieni un libro in ogni stanza dove passi del tempo.","Leggi sempre alla stessa ora per creare un rito.","Prepara la luce giusta per leggere a letto.","Scegli il prossimo libro prima di finire quello in corso.","Tieni un audiolibro per le passeggiate.","Iscriviti a un gruppo di lettura: leggere con altri rende costante il ritmo.","Regala e scambia libri con gli amici: ogni scambio apre una conversazione.","Scrivi due righe su ogni libro finito.","Riduci lo schermo la sera per far spazio alle pagine."],"C":["La radice della lettura è il rito serale.","Due gesti fissi valgono più di grandi propositi.","Anche nelle sere tardive, leggi una pagina.","Il quaderno delle citazioni diventa un tesoro.","Ogni libro ti cambia un po', anche quando non te ne accorgi subito.","Leggere regolarmente arricchisce il vocabolario.","Le storie ti insegnano a capire gli altri.","Non avere fretta di finire: assapora.","Ogni sera di lettura è una stella nel tuo cielo.","Il piacere della lettura cresce con la pratica.","Leggere in silenzio è una forma di riposo.","La curiosità ti porta da un libro all'altro.","Celebra ogni dieci libri letti con un piccolo rito tuo.","Il tuo gusto si affina libro dopo libro.","La lettura è un'abitudine gentile: coltivala con dolcezza."],"R":["Hai perso il ritmo? Riparti dal rito serale.","Se un libro non ti prende più, cambialo.","Dopo un periodo intenso, scegli un libro leggero.","Torna al gruppo di lettura: ti rimette in moto.","Se la sera sei troppo stanco, leggi la mattina.","Riprendi il quaderno delle citazioni.","Rileggi le citazioni salvate: ti ricordano perché leggi.","Se hai abbandonato l'obiettivo annuale, dimenticalo e leggi.","Ricomincia con un libro sottile: finirlo ti restituisce fiducia.","Un audiolibro può riaccendere la voglia.","Se lo schermo ti ha rubato le sere, nascondi il telefono.","Leggi un capitolo ad alta voce a qualcuno.","Riprendi da un genere che ami: il piacere viene prima della sfida.","Torna in biblioteca e scegli a caso.","La lettura perdona sempre: riprendila oggi."],"M":["Leggi a letto, ma su carta: lo schermo disturba il sonno.","Spegni gli schermi un'ora prima della lettura serale.","Il weekend è adatto ai libri lunghi.","Usa il tragitto per ascoltare un audiolibro.","Leggi saggi al mattino, romanzi la sera.","Dopo una giornata faticosa, scegli storie leggere.","Prima di un viaggio, scegli i libri da portare.","Durante le pause caffè, leggi un articolo lungo invece dello scroll.","Il gruppo di lettura funziona bene a metà mese.","Nelle sere di pioggia regalati un capitolo in più.","Al risveglio, dieci minuti di poesia.","Leggi in vacanza quello che non riesci a leggere durante l'anno.","La domenica sera chiudi la settimana con una lettura.","Leggi dopo cena invece di guardare serie.","Nei momenti di ansia, un romanzo familiare consola."]},{"S":["Piano B: se non hai tempo per leggere, ascolta dieci minuti di audiolibro.","Alterna letture impegnative e leggere.","Tieni un libro di poesie per i momenti brevi.","Usa un e-reader per leggere ovunque.","Organizza la libreria per ritrovare i libri amati.","Scrivi una breve recensione per ogni libro.","Prepara una lista di letture per stagione.","Leggi più libri in parallelo di generi diversi.","Sottolinea e annota i margini: dialogare con il libro lo rende tuo.","Partecipa a un club del libro online.","Leggi i classici a piccole dosi: qualche pagina al giorno basta.","Fai una lista di autori da scoprire.","Rileggi i libri che ti hanno cambiato.","Prendi appunti sui libri di saggistica.","Scambia consigli di lettura con amici."],"C":["Il flusso della lettura arriva quando la storia ti prende.","Tre momenti di lettura alla settimana diventano una vita di libri.","Se la settimana è piena, leggi la versione corta.","La costanza si misura in libri finiti all'anno.","Ogni libro apre la strada al prossimo.","La lettura regolare migliora la scrittura.","Leggere ti insegna a pensare con calma.","Le storie ti accompagnano anche dopo l'ultima pagina.","Il tuo cielo di libri si riempie, una stella alla volta.","Leggere è un dialogo con menti lontane.","Le citazioni salvate diventano parte di te.","Ogni genere ti insegna qualcosa di diverso.","La lettura profonda è rara: proteggila.","Celebra ogni classico affrontato: è una montagna salita.","Il piacere di leggere viene prima del dovere di finire."],"R":["Bloccato in un libro? Saltalo o cambialo.","Hai saltato giorni di lettura? Riparti da una poesia.","Se un libro ti spaventa per la lunghezza, leggilo a piccoli capitoli.","Un periodo arido: rileggi i preferiti.","Riprendi dalle tue sottolineature: ti ricordano perché amavi quel libro.","Se lo stress ti ha allontanato, scegli libri di conforto.","Torna al club del libro anche se non hai finito la lettura.","Se sei saturo di saggistica, leggi un romanzo.","Riparti con fumetti o graphic novel.","Leggi una storia breve stasera: un racconto si chiude in una sera.","Torna in biblioteca e lasciati guidare dagli scaffali.","Se non trovi il tempo, ascolta durante le faccende.","Riprendi la lista di letture e scegli il titolo che ti chiama di più.","Il ritorno ai libri è sempre accolto.","Ogni ritorno ti trova con occhi nuovi."],"M":["La lettura profonda richiede silenzio: trovalo.","Dopo cena, la luce soffusa invita alle pagine.","Il weekend mattina è perfetto per la saggistica.","Nelle vacanze, porta libri diversi dal solito.","Prima di dormire, evita libri troppo eccitanti.","Nei momenti di attesa, leggi articoli lunghi.","Il lunedì scegli cosa leggere nella settimana.","Il venerdì sera regalati un capitolo in più.","In treno leggi senza interruzioni: il viaggio diventa tempo tuo.","Nelle giornate di malattia, gli audiolibri aiutano.","In autunno, storie lunghe e avvolgenti.","In primavera scegli poesia e letture leggere.","Dopo un evento emozionante, leggi per elaborare.","Prima di una decisione importante, leggi chi ci è passato.","Nelle notti insonni, leggi qualcosa di noioso."]},{"S":["Ogni mese rivedi le letture e scegli la prossima direzione.","Dai ai progetti di lettura un tema: un autore, un secolo, un paese.","Condividi ciò che leggi con qualcuno.","Tieni un archivio delle recensioni: anche due righe per libro.","Alterna libri lunghi e brevi per non perdere lo slancio.","Leggi in lingua originale qualcosa che conosci.","Organizza un piccolo club di lettura.","Costruisci una bibliografia sul tuo tema preferito.","Leggi i libri citati nei libri che ami.","Scrivi lettere agli autori, anche se non le spedisci.","Pianifica le letture dell'anno per stagione.","Annota le idee nate dalla lettura: sono il frutto più prezioso.","Leggi critica e saggi sui libri che ami.","Visita i luoghi dei libri che hai amato.","Crea una mappa dei tuoi libri: autori, temi, collegamenti."],"C":["Lo slancio nella lettura si nutre di scoperte.","Con più letture in corso, scegli con cura quali portare avanti.","Quando tutto scorre, approfondisci un autore.","La tua costanza ti ha reso un lettore vero.","La lettura ti ha cambiato il modo di vedere.","Ogni libro è una conversazione con qualcuno che non incontrerai mai.","Lo slancio non è leggere di più, è leggere meglio.","Riconosci i tuoi progressi: guarda la lista.","Condividere i libri crea legami: presta quello che ti ha cambiato.","La lettura ti ha reso più empatico: hai vissuto molte vite.","Più leggi, più capisci cosa ti piace.","Le pagine lette sono una ricchezza silenziosa.","Celebra i libri difficili che hai finito.","La lettura è un'abitudine di libertà.","Ogni anno il tuo cielo ha più stelle."],"R":["Se lo slancio cala, torna a un libro breve.","Dopo un libro difficile, leggi qualcosa di leggero.","Se perdi motivazione, rileggi un preferito.","Se devi rimandare un libro, fissa una data per riprenderlo.","Chiediti cosa ti ha tolto il piacere.","Dopo un periodo intenso prova un audiolibro: leggere anche ascoltando.","Se ti senti saturo, cambia genere: la novità riaccende la curiosità.","Riprendi dalle recensioni: rileggerle ti ricorda cosa cercavi.","Torna al club: la conversazione riaccende la voglia di leggere.","Se un progetto di lettura annoia, lascialo.","Ricomincia da un libro consigliato da un amico.","Dopo un trasloco, ricrea l'angolo di lettura.","La pausa dalla lettura può essere fertile: torni con occhi nuovi.","Torna alla poesia: poche righe, molta luce.","Ogni ripartenza è un nuovo capitolo."],"M":["Pianifica le letture dell'anno a gennaio.","Usa le mattine del weekend per i saggi.","A fine mese fai il punto sulle letture e scegli le prossime.","Dopo un grande libro, lascia un giorno vuoto.","La sera presto è il momento dei romanzi.","Al mattino dedica qualche pagina alla saggistica.","Prima di un viaggio, leggi sul luogo.","In vacanza affronta i libri lunghi che rimandavi.","Quando hai poco tempo leggi una poesia.","Nelle sere d'inverno affronta un classico.","Dopo un evento importante, leggi per capirlo meglio.","Nei periodi di stress, libri di conforto.","A inizio stagione scegli un tema per le tue letture.","Quando sei ispirato, scrivi dopo aver letto.","Durante le feste regala libri scelti con cura."]},{"S":["Le letture vanno da sole: prova un progetto ambizioso, come un classico lungo.","Scrivi la tua lista dei libri della vita.","Ogni stagione esplora un genere nuovo.","Consiglia libri a chi ti chiede: è un dono.","Tieni un libro di riserva per i periodi difficili.","Crea una biblioteca personale ragionata.","Scrivi recensioni pubbliche: aiuti altri lettori a trovare la loro stella.","Leggi in un'altra lingua: un libro è anche una porta su un'altra cultura.","Partecipa a festival letterari per incontrare autori e lettori.","Fai da guida in un gruppo di lettura.","Rileggi i grandi libri a distanza di anni.","Costruisci percorsi di lettura per gli altri.","Proteggi il tempo di lettura come un bene prezioso.","Tieni un diario delle letture: data, titolo, una frase.","Sperimenta letture lente: un libro al mese, assaporato."],"C":["Ormai leggere fa parte di te, come respirare.","Rileggi la lista dei primi libri: guarda la strada.","Una mente lettrice resta curiosa a ogni età.","Su questa base puoi permetterti progetti lunghi.","Rinnova ogni tanto il motivo per cui leggi.","La lettura è compagnia nella solitudine.","Più leggi, più vite vivi oltre la tua.","Non smettere di scoprire nuovi autori.","Celebra la tua biblioteca: è il ritratto della tua mente.","Ogni anno un libro ti cambia la vita.","La lettura è un cielo infinito: ci sono sempre nuove stelle.","Condividere i libri fa crescere gli altri.","La tua esperienza di lettore è preziosa.","La lettura lenta è un lusso: concediteli.","Le storie restano con te per sempre."],"R":["Anche all'orizzonte capitano mesi senza libri: riparti da una pagina.","Se la lettura si spegne, prova un formato nuovo.","Dopo un periodo difficile, rileggi i preferiti.","Ciò che hai letto non si perde: vive nel tuo modo di pensare.","Ritrova il gusto con un libro dell'infanzia.","Se ti senti saturo, leggi poesia: poche parole, molto spazio.","Dopo un cambio di vita, ricrea il rito.","Una lunga pausa può portare nuovi gusti.","Torna in biblioteca anche solo per sfogliare.","Riprendi con un club di lettura: il gruppo ti riporta dentro.","Se ti senti distratto, leggi ad alta voce.","Ricomincia da un racconto breve, da leggere in una sera.","Non devi leggere quanto prima: anche poche pagine bastano.","Ogni ritorno alla lettura porta nuove stelle nel tuo cielo.","La lettura sa aspettare: i libri non hanno fretta."],"M":["Usa i viaggi per leggere in profondità.","Un giorno al mese dedicato a una libreria.","Il momento giusto per un classico è quando le basi reggono.","La sera tranquilla è perfetta per rileggere.","Ogni anno scegli un autore da conoscere a fondo.","Prima di un cambiamento, leggi chi l'ha vissuto.","Nei periodi intensi tieni solo la pagina serale.","A fine anno scegli il libro dell'anno.","Quando sei ispirato, leggi tutto di un autore.","In estate affronta i libri lunghi sotto l'ombrellone.","In inverno torna ai classici, accanto a una luce calda.","A ogni compleanno regalati un libro scelto con cura.","Durante le feste, leggi accanto a qualcuno.","Quando la vita rallenta, leggi di più.","Dopo un traguardo, scegli il prossimo viaggio di pagine."]}],"Bloom":[{"S":["Tieni un taccuino sempre con te: le idee sbocciano quando vogliono loro.","Lascia il materiale creativo in vista, aperto, pronto: colori, strumento, pagina.","Lega la creatività a un gesto quotidiano: dopo il caffè, dieci minuti di petali.","Crea un angolo, anche minuscolo, dove sei solo tu e la tua idea.","Scegli un formato piccolo: un foglio A5, un minuto di registrazione, una strofa.","Prepara la sera prima ciò che userai: niente ricerca, solo germoglio.","Usa un timer da dieci minuti: il limite libera la paura della pagina bianca.","Togli il telefono dalla stanza: i petali non crescono sotto le notifiche.","Tieni una cartella «semi» per immagini, frasi, suoni che ti ispirano.","Decidi in anticipo cosa farai: «tre schizzi del vaso», non «disegnare».","Metti una musica che usi solo quando crei: diventa il tuo rito.","Lascia un'opera iniziata a metà: riprenderla domani sarà facile.","Scrivi in alto alla pagina la data: ogni giorno è un piccolo fiore.","Usa materiali economici all'inizio: rendono più facile sbagliare.","Riduci le scelte: un colore, una matita, un tema."],"C":["Non aspettare l'ispirazione: siediti, e lei ti trova al lavoro.","Dieci minuti al giorno di creatività valgono più di un weekend all'anno.","Fai brutto, fai tanto: la quantità prepara la qualità.","Ogni schizzo imperfetto è un petalo che prepara il fiore.","Non mostrare subito a nessuno: lascia crescere il germoglio al riparo.","La creatività è un muscolo: va allenata, non aspettata.","Celebra il fatto di aver creato, non il risultato.","In questa tappa conta presentarsi alla pagina, non quello che ne esce.","Smetti finché ti diverti ancora: domani avrai voglia di tornare.","Il giudizio interno parla forte all'inizio: lascialo parlare e continua.","Ogni volta che crei diventi un po' di più una persona creativa.","Copia chi ami per imparare: anche i grandi hanno cominciato così.","Un piccolo atto creativo al giorno cambia il modo in cui guardi le cose.","Il blocco si scioglie muovendo la mano, non pensando.","Non serve talento per cominciare: serve un appuntamento."],"R":["Saltato un giorno? Fai uno scarabocchio di trenta secondi: il seme è ancora vivo.","Non recuperare: crea oggi, come se fosse il primo giorno.","Se la pagina ti spaventa, comincia da una linea storta.","Una settimana senza creare non cancella niente: i semi aspettano.","Torna al tuo angolo e tocca il materiale: spesso basta questo.","Se un progetto ti pesa, fanne uno nuovo minuscolo.","Cambia mezzo per un giorno: dalla penna alla foto, dalla foto al suono.","Ricomincia copiando qualcosa che ti piace.","Se il giudizio ti ha bloccato, crea qualcosa di volutamente brutto.","Mai saltare due volte: anche un minuto di creatività conta.","Rileggi il taccuino dei semi: un'idea vecchia può fiorire oggi.","Ripartire è parte del processo creativo, non un'interruzione.","Se sei stanco, guarda opere che ami: anche questo nutre.","Lascia andare il progetto abbandonato: non tutti i semi devono fiorire.","Il ritorno più dolce è con un gesto giocoso."],"M":["La mattina presto il critico interno dorme ancora: approfittane.","La sera tardi la mente è più libera e associativa.","Dieci minuti prima di iniziare il lavoro danno colore a tutta la giornata.","Crea quando sei appena tornato da una passeggiata.","Nelle pause di lavoro fai un mini schizzo invece di guardare il telefono.","Il fine settimana regala tempi lunghi: usali per un progetto più grande.","Scegli un'ora fissa: il fiore si apre sempre alla stessa luce.","Dopo una doccia le idee arrivano: tieni il taccuino in bagno.","Durante i viaggi osserva e annota: la creatività si nutre di novità.","Nei giorni grigi la creatività è un riparo, non un dovere.","Prima di dormire scrivi una domanda creativa: il sonno lavora per te.","Se sei più vivo di pomeriggio, rispetta il tuo ritmo.","Nei momenti di attesa, guarda forme e colori intorno a te.","Evita di creare subito dopo aver letto le notizie.","Un momento creativo dopo una giornata faticosa ricarica, non stanca."]},{"S":["Due gesti fissi: raccogliere un'idea al giorno e creare dieci minuti.","Prova le «pagine del mattino» di Julia Cameron: tre pagine a mano, senza rileggerle.","Programma una «artist date» a settimana: un'ora da solo in un posto che ti ispira.","Tieni un unico quaderno per schizzi, idee e appunti creativi.","Prepara un kit portatile: matita, quaderno piccolo, auricolari.","Fotografa ogni giorno una cosa bella: è un archivio di semi.","Riserva una mensola o una scatola ai materiali creativi.","Crea una playlist per il lavoro creativo e usala solo lì.","Scrivi una lista di dieci progetti piccoli pronti da iniziare.","Dai un nome al tuo progetto: diventa più reale.","Usa vincoli creativi: solo tre colori, solo cento parole.","Tieni un registro delle sessioni: data e una parola su com'è andata.","Prepara l'ambiente come un rito: luce, acqua, silenzio.","Rendi visibile ciò che hai creato: appendilo, conservalo.","Scegli un tema per il mese: fiori, città, ritratti, suoni."],"C":["La radice della creatività è l'appuntamento fisso.","Due gesti piccoli e regolari valgono più di un'ispirazione rara.","Anche nelle giornate piene raccogli un seme: una frase, una foto.","La mano diventa sicura con la ripetizione, non con il talento.","Il quaderno pieno è la prova che stai crescendo.","La pratica quotidiana abbassa la paura del foglio bianco.","Non confrontarti con chi crea da anni: confrontati con te di un mese fa.","Ogni settimana guarda indietro: vedrai piccoli fiori ovunque.","La costanza creativa nasce dal piacere, proteggilo.","Il tuo stile emerge facendo, non pensando.","Concediti di cambiare idea: la creatività è movimento.","Termina ciò che inizi almeno una volta a settimana.","Le idee migliori arrivano dopo le prime cento.","Un'opera finita insegna più di dieci progetti immaginati.","Coltiva la curiosità come un giardiniere coltiva il terreno."],"R":["Hai perso il ritmo? Torna alle pagine del mattino, anche solo una.","Se un progetto non ti prende più, cambialo: l'abitudine conta più del titolo.","Riprendere uno strumento dopo una pausa: suona solo ciò che sai già.","Rileggi il quaderno e aggiungi una riga a un'idea vecchia.","Quando la testa è piena, il gesto mini è guardare un'opera che ami.","Se l'artist date salta, fanne una di quindici minuti.","Il giudizio degli altri ti ha fermato? Torna a creare solo per te.","Ricomincia con un vincolo semplice: cinque minuti, un colore.","Una settimana arida è normale: continua a raccogliere semi.","Se ti annoi, cambia luogo o strumento.","Riprendi da un progetto piccolo e finiscilo in un giorno.","Torna al tuo angolo creativo e riordinalo: è già ripartire.","Non aspettare l'ispirazione per tornare: torna e lei arriverà.","Se hai perso fiducia, guarda le cose che hai già creato.","Ogni ritorno alla pagina è una vittoria."],"M":["Leggi, ascolta o guarda qualcosa di bello prima di creare.","Crea nello stesso posto e alla stessa ora: il cervello si prepara da solo.","Il fine settimana è adatto ai progetti lunghi.","Usa il tragitto per raccogliere idee, non per lo scroll.","Le idee migliori arrivano camminando: tieni le note a portata.","Dopo una giornata di lavoro, cinque minuti di disegno separano i due mondi.","L'artist date funziona bene il sabato mattina.","Nei mesi bui crea con colori caldi e luce morbida.","La sera presto è ideale per la pratica tecnica.","Il mattino è ideale per inventare.","Prima di una scadenza creativa, fai sessioni brevi ogni giorno.","Durante le ferie porta con te il kit portatile.","Nelle giornate di pioggia dedicati ai progetti al chiuso.","Quando ti senti agitato, crea con le mani: argilla, collage, cucito.","Il primo sole di primavera è un ottimo invito a disegnare fuori."]},{"S":["Piano B creativo: se non hai tempo per creare, raccogli spunti per cinque minuti.","Alterna giorni di produzione e giorni di raccolta.","Tieni una bacheca di ispirazione fisica o digitale.","Dividi i progetti grandi in sessioni da quaranta minuti.","Usa una checklist di fine sessione: salva, annota, lascia il prossimo passo.","Trova un compagno creativo con cui condividere i progressi.","Prepara le tele, i file, gli spartiti in anticipo per la settimana.","Tieni un archivio delle opere finite, anche quelle che non ti piacciono.","Iscriviti a una sfida creativa: trenta giorni, un tema.","Separa il momento di creare dal momento di correggere.","Usa riferimenti visivi, ma tienili lontani durante la creazione libera.","Organizza il materiale per progetto, non per tipo.","Lascia sempre un'opera in corso pronta per i momenti liberi.","Programma una sessione lunga a settimana e due brevi.","Annota le scoperte tecniche: diventano il tuo manuale."],"C":["Il flusso creativo arriva dopo i primi quindici minuti: resta oltre la soglia.","Tre attività creative si nutrono a vicenda: leggere nutre lo scrivere.","Quando la giornata salta, fai la versione corta: il ritmo conta più della durata.","Non giudicare quello che crei mentre lo crei: c'è tempo dopo.","La costanza creativa si misura in mesi.","Finire le cose, anche imperfette, ti rende più coraggioso.","Ogni opera ti insegna cosa vuoi fare nella prossima.","La creatività cresce dove c'è gioco e regolarità insieme.","Il confronto con altri creativi ti spinge, ma il ritmo è tuo.","Sperimenta con una tecnica nuova ogni mese.","Ogni fallimento creativo è un esperimento riuscito.","Le opere migliori nascono spesso dalle versioni scartate.","Mostrare il tuo lavoro richiede coraggio: comincia da poche persone.","La pratica ti porta in luoghi che non immaginavi.","Proteggi il piacere: è il carburante del tuo fiore."],"R":["Bloccato? Cambia strumento: dalla tastiera alla carta.","Hai saltato giorni di pratica? Il primo giorno è solo per riscaldarti.","Se un progetto ti spaventa, dividilo in un passo da cinque minuti.","Un periodo arido è normale: continua a raccogliere.","Quando il critico interno urla, crea per il cestino.","Se il progetto è troppo ambizioso, riducilo a un assaggio.","Torna alla sfida più piccola che conosci.","Dopo una critica dura, crea qualcosa solo per divertimento.","Se perdi interesse, cerca ispirazione in un campo diverso.","Riprendi un'opera vecchia e trasformala.","Ricomincia dal kit portatile: niente scuse logistiche.","La pausa creativa può essere fertile: ascoltala, poi torna.","Torna alla bacheca di ispirazione e scegli una sola immagine.","Se sei esausto, il riposo è parte della creatività.","Ogni ritorno ti trova con occhi nuovi."],"M":["La concentrazione creativa vive meglio in blocchi da quaranta minuti.","Dopo un'attività fisica la mente è più associativa.","Crea quando la casa è in silenzio: mattina presto o sera tardi.","Una pausa all'aria aperta sblocca più di un'ora davanti alla pagina.","Programma le sessioni lunghe nei giorni senza impegni serali.","Il lunedì scegli l'opera della settimana.","Il venerdì guarda cosa hai creato.","Prima di dormire annota un'idea per la sessione di domani.","Nei periodi di lavoro intenso, tieni solo la raccolta di semi.","Le ore dopo il tramonto favoriscono la scrittura introspettiva.","Il mattino del weekend è perfetto per i progetti personali.","Quando sei di buon umore, affronta la parte più difficile dell'opera.","Nei giorni malinconici, crea con delicatezza: anche quello è un fiore.","Prima di una mostra o consegna, fermati un giorno a guardare.","Durante le vacanze cambia mezzo creativo."]},{"S":["Ogni settimana rivedi cosa hai creato e cosa vuoi esplorare.","Dai ai progetti una scadenza morbida: lo slancio ama un traguardo.","Condividi qualcosa che hai creato ogni mese.","Tieni un portfolio aggiornato dei lavori migliori.","Alterna progetti lunghi e piccole creazioni veloci.","Studia un maestro per un mese: copia, analizza, reinventa.","Crea una routine di revisione: rileggere, scartare, migliorare.","Partecipa a un gruppo o laboratorio creativo.","Investi in uno strumento migliore quando la pratica lo merita.","Pianifica una serie: cinque opere sullo stesso tema.","Scrivi una piccola dichiarazione su ciò che vuoi esprimere.","Organizza le idee in una mappa visiva.","Dedica una sessione al mese all'esplorazione pura, senza obiettivi.","Proteggi il tempo creativo dagli impegni degli altri.","Rivedi il tuo spazio creativo ogni stagione."],"C":["Lo slancio creativo si nutre di finire le cose.","Con più progetti, il margine è ciò che ti salva.","Quando tutto scorre, approfondisci invece di allargare.","La tua voce sta emergendo: ascoltala.","Le opere che ti mettono a disagio spesso ti fanno crescere.","Il riscontro degli altri è utile, ma la tua direzione viene prima.","Più crei, più vedi il mondo come materia prima.","Lo slancio non è fretta: è continuità con entusiasmo.","Ogni serie completata è una piccola mostra personale.","Ricorda il gioco: lo slancio senza gioco diventa fatica.","La tecnica cresce, ma il cuore resta il motivo.","Ogni anno guarda i lavori di allora: vedrai un giardino.","La creatività condivisa genera altra creatività.","Non smettere di imparare: ogni tecnica è un nuovo colore.","Il tuo percorso creativo è unico: non serve somigliare a nessuno."],"R":["Se lo slancio cala, torna per una settimana a una sola pratica.","Un progetto arenato può aspettare: tieni vivo il gesto quotidiano.","Dopo un periodo intenso concediti di consumare arte senza produrla.","Rimanda con una data: la creatività ama gli appuntamenti.","Chiediti cosa ti ha tolto il piacere e cambia quella cosa.","Se la serie si è fermata, finiscila con un'opera più semplice.","Dopo un rifiuto, crea qualcosa solo per te.","Torna al laboratorio o al gruppo: la compagnia rimette in moto.","Se ti senti ripetitivo, imponi un vincolo nuovo.","Riprendi il portfolio: rivedere il percorso riaccende.","Ricomincia da uno schizzo veloce: cinque minuti, senza giudizio.","Se sei in crisi di idee, raccogli semi per una settimana.","Una stagione di riposo creativo prepara la fioritura successiva.","Quando la vita ti travolge, la creatività aspetta paziente.","Ogni volta che torni sei più ricco di esperienze."],"M":["Pianifica la settimana creativa la domenica: un progetto, tre sessioni.","Usa le mattine del weekend per le cose che richiedono respiro.","Fai il punto a fine mese su cosa hai creato.","Dopo aver finito un progetto, lascia un giorno vuoto.","La primavera invita a uscire a disegnare o fotografare.","L'inverno è adatto ai progetti lunghi al chiuso.","Prima di una scadenza, riserva una giornata intera.","Nei viaggi raccogli materiale per le opere future.","Quando hai poco tempo, fai bozzetti veloci.","Il tardo pomeriggio è spesso un momento di luce bella.","Dopo un evento emozionante, crea finché il ricordo è vivo.","Nei periodi di stress, la creatività manuale calma.","Il primo giorno del mese scegli il tema creativo.","Quando ti senti ispirato, lascia stare il resto e crea.","Dopo un'artist date, lavora subito su ciò che ti ha colpito."]},{"S":["Le pratiche reggono da sole: è il momento di un progetto ambizioso.","Scrivi il tuo metodo creativo: ti servirà nei periodi difficili.","Ogni stagione scegli una tecnica da esplorare.","Insegna ciò che sai: spiegare approfondisce la tua pratica.","Tieni una versione mini sempre pronta: uno schizzo, una frase.","Organizza una piccola mostra o pubblicazione dei tuoi lavori.","Collabora con un creativo di un'altra disciplina.","Crea un archivio ordinato di tutta la tua produzione.","Dedica un giorno all'anno a rivedere tutto ciò che hai creato.","Proteggi il tempo creativo come una priorità di vita.","Scegli progetti che ti spaventano un po'.","Coltiva una rete di persone che apprezzano il tuo lavoro.","Sperimenta con un formato completamente nuovo.","Costruisci un luogo creativo stabile, anche minimo.","Lascia spazio alla contemplazione: non tutto deve diventare un'opera."],"C":["All'orizzonte creare fa parte di chi sei.","Rileggi i primi quaderni: guarda quanta strada hai fatto.","La creatività matura resta curiosa.","Su questa base puoi permetterti un progetto che dura un anno.","Rinnova il motivo per cui crei: cambia nel tempo.","Il tuo stile è riconoscibile: proteggilo e fallo evolvere.","Creare per gli altri e creare per te sono due cose diverse: tienile entrambe.","La pratica regolare ti ha reso libero di sperimentare.","Ogni anno fiorisce qualcosa di inatteso.","La maestria è continuare a sentirsi principianti.","Il tuo giardino creativo ha bisogno di cura, non di perfezione.","Condividere ciò che sai fa fiorire anche gli altri.","La creatività è un modo di vivere, non un'attività.","Ricorda il piacere della prima volta.","Coltiva la meraviglia: è il seme di tutto."],"R":["Anche all'orizzonte capitano settimane vuote: riparti da un'idea.","Se una passione si spegne, lasciala riposare e prova un nuovo linguaggio.","Dopo un periodo difficile, torna alla scintilla: cinque minuti.","Ciò che hai imparato non si perde: riprendi da dove ti senti sicuro.","Ritrova il gusto rifacendo una cosa che ti è sempre piaciuta.","Se ti senti bloccato dal successo, crea qualcosa di anonimo.","Dopo un progetto enorme, concediti mesi di piccole cose.","Quando cambia la vita, cambia anche il tuo modo di creare.","Una lunga pausa può portare una voce nuova.","Torna alle pagine del mattino nei momenti di confusione.","Riprendi con un corso o un laboratorio.","Se la critica ti ha ferito, torna alla creazione privata.","Ricomincia osservando: la creatività parte dallo sguardo.","Non devi tornare come prima: torna come sei adesso.","Ogni ritorno alla creatività è una nuova fioritura."],"M":["Usa i cambi di stagione per nuovi stimoli.","Un giorno al mese dedicato solo a esplorare, senza obiettivi.","Il momento giusto per un progetto grande è quando le basi vanno da sole.","La sera tranquilla è perfetta per riflettere su ciò che hai creato.","Ogni anno scegli una competenza nuova da coltivare.","Dopo un viaggio, trasforma i ricordi in opere.","Nei periodi intensi tieni solo la raccolta quotidiana.","Prima di un progetto lungo, fai una settimana di prove.","A fine anno crea qualcosa che lo racconti.","Quando ti senti ispirato da qualcosa, fermati e crea subito.","In estate sperimenta all'aperto.","In inverno approfondisci la tecnica.","Ogni compleanno crea un piccolo autoritratto, in qualsiasi forma.","Durante le feste regala qualcosa che hai creato.","Quando la vita rallenta, la creatività può accelerare."]}],"Brook":[{"S":["Metti le scarpe comode vicino alla porta: il ruscello scorre dove trova la strada aperta.","Scegli un percorso fisso di dieci minuti intorno a casa: niente decisioni, solo passi.","Lega il movimento a un gesto che fai già: dopo il caffè, due minuti di stiramento.","Riempi una bottiglia d'acqua al mattino e tienila sempre in vista.","Imposta un promemoria gentile ogni ora per alzarti dalla sedia.","Lascia il tappetino arrotolato accanto al divano, pronto da srotolare.","Scegli le scale invece dell'ascensore almeno per un piano.","Prepara una playlist da camminata di dieci minuti esatti.","Scendi dal mezzo una fermata prima e cammina il resto.","Quando parli al telefono, cammina invece di stare seduto.","Tieni un paio di scarpe da passeggio in ufficio o in macchina.","Scrivi su un foglietto il tuo movimento mini: «due minuti di passi».","Parcheggia un po' più lontano: i passi in più arrivano da soli.","Metti la sveglia cinque minuti prima per un piccolo giro all'aria.","Scegli un compagno di passeggiata per un giorno a settimana."],"C":["Muoversi un po' ogni giorno vale più di uno sforzo raro.","Anche due minuti di movimento tengono vivo il fiume del corpo.","Fermati prima di stancarti: il corpo ricorda il piacere, non la fatica.","Conta i giorni in cui ti muovi, non i chilometri.","Ogni passo dice al corpo che te ne prendi cura.","In questa tappa conta presentarsi, non la prestazione.","Brevi pause di movimento durante il giorno contano davvero.","Il corpo ama il ritmo: un po' ogni giorno lo rende fluido.","Celebra la camminata con un respiro profondo all'aria aperta.","Non serve sudare per cominciare: serve muoversi.","Più ti muovi, più hai energia, anche quando sembra il contrario.","Ogni giorno in movimento è acqua che scorre e non ristagna.","Il buonumore dopo una camminata è la tua ricompensa: notalo.","Non confrontarti con chi corre maratone: segui il tuo ritmo.","Un corpo che si muove è un corpo che si sente vivo."],"R":["Saltato un giorno? Fai due minuti di mobilità adesso: il ruscello riprende a scorrere.","Ripartire dopo una pausa: la versione mini è il punto giusto.","Se il corpo è stanco, cammina piano invece di fermarti del tutto.","Un giorno fermo non cancella i progressi: muoviti oggi.","Dopo un malanno riparti piano: il corpo ha la sua memoria.","Mai saltare due giorni di fila: anche dieci passi contano.","Se piove, muoviti in casa: scale, corridoio, una canzone da ballare.","Riparti dal tuo percorso fisso: il luogo ti ricorda il gesto.","Se ti senti pigro, esci solo fino all'angolo: spesso poi continui.","Torna alle scarpe vicino alla porta: è il primo passo del ritorno.","Se la giornata è saltata, una passeggiata serale breve basta.","Non recuperare con uno sforzo grande: torna al ritmo piccolo.","Se la motivazione è bassa, chiama un amico e cammina parlando.","Ripartire è parte del movimento: anche l'acqua si ferma e riparte.","Il ruscello trova sempre la sua strada: anche tu."],"M":["Il mattino è il momento migliore per muoversi: nessuno ti ha ancora rubato tempo.","Una camminata dopo pranzo aiuta la digestione e la concentrazione.","Bevi un bicchiere d'acqua appena sveglio.","Muoviti prima di sederti al lavoro: la mente parte più sveglia.","La sera prediligi movimenti dolci: stretching e respiro.","Ogni ora seduto, due minuti in piedi.","Durante le telefonate cammina: la voce scorre meglio quando il corpo si muove.","Dopo cena, dieci minuti di passi aiutano la digestione.","Nel weekend allunga la passeggiata di qualche minuto, senza fretta.","Nei giorni di sole, esci all'aperto: la luce fa bene all'umore.","Prima di una riunione importante, una breve camminata schiarisce la mente.","Quando ti senti agitato, muoviti: il corpo scarica la tensione.","La pausa caffè diventa una pausa movimento.","Al ritorno a casa, cambia scarpe e fai un giro corto.","Il momento migliore è quello che riesci a ripetere ogni giorno."]},{"S":["Due gesti fissi: un bicchiere d'acqua al risveglio e dieci minuti di cammino.","Prepara la borsa o lo zaino la sera prima.","Scegli due giorni fissi per un movimento più lungo.","Tieni un piccolo spazio libero in casa per muoverti senza spostare niente.","Usa una sveglia sul telefono per ricordarti di alzarti.","Tieni un contapassi o usa quello del telefono, senza ossessione.","Programma una camminata con un amico ogni settimana.","Pianifica un percorso alternativo per i giorni di pioggia.","Prepara una routine di mobilità di cinque minuti per il mattino.","Metti promemoria per l'acqua a metà mattina e a metà pomeriggio.","Tieni un ombrello e una giacca leggera vicino alla porta.","Scegli un'attività che ti diverte: ballo, bici, nuoto.","Annota come ti senti dopo il movimento.","Prepara una mappa di percorsi diversi nel quartiere.","Tieni le cuffie cariche per le passeggiate con podcast."],"C":["La radice del corpo è la regolarità: meglio poco ogni giorno.","Anche nelle giornate piene, cinque minuti di movimento tengono vivo il ritmo.","Il corpo si adatta lentamente: fidati delle settimane.","Ogni ripetizione rafforza il gesto: tra un mese ti sembrerà naturale.","Ascolta il corpo: la costanza non è ignorare i segnali.","Le pause di movimento fanno bene anche alla mente.","Camminare con altri rende il tempo più leggero.","Ogni settimana in movimento migliora sonno e umore.","Non serve la palestra per essere attivo.","Il movimento quotidiano è una forma di cura.","Più ti muovi, più il corpo ti chiede di muoverti.","Il ruscello non si sforza: scorre perché non smette.","Celebra i giorni in cui hai camminato senza pensarci.","La varietà mantiene vivo il piacere.","L'acqua che bevi sostiene ogni movimento."],"R":["Hai perso il ritmo? Riprendi dai due gesti più facili.","Se un'attività ti pesa, cambiala con una che ti piace.","Dopo una settimana ferma, ricomincia con metà del tempo.","Il corpo non ti giudica: riparte appena gli dai occasione.","Un dolore va ascoltato: fai mobilità dolce e riprendi quando passa.","Se il tempo è brutto, muoviti in casa con un video.","Torna alla camminata con l'amico: fissate subito giorno e ora.","Riprendi dal percorso più bello che conosci: la bellezza tira i passi.","Se sei di cattivo umore, muoviti: aiuta.","Dopo un viaggio, riprendi con una passeggiata lunga.","Se la sveglia ti infastidisce, cambia suono, non abitudine.","Torna alla bottiglia d'acqua in vista.","Ricomincia con dieci minuti a piedi: il ruscello riparte da un filo d'acqua.","Ogni ritorno al movimento è un ritorno a te.","L'acqua ferma riparte con il primo sasso spostato."],"M":["Muoversi alla stessa ora aiuta il corpo a prepararsi.","Prima di cena è un buon momento per l'attività più intensa.","Una pausa di movimento ogni ora rende il lavoro meno pesante.","Lo stretching prima di dormire scioglie le tensioni.","Nel weekend allunga i tempi e scegli un sentiero nuovo.","Nei giorni caldi muoviti presto o tardi.","Nei giorni freddi, riscaldati in casa prima di uscire.","Bevi un bicchiere d'acqua prima di ogni pasto.","Dopo una giornata seduto, cammina anche se sei stanco.","Il mattino presto è il momento più tranquillo per uscire.","Le passeggiate al tramonto sono un piccolo regalo.","Durante le telefonate lunghe, muoviti.","Prima di un esame o di una presentazione, cammina.","Dopo un pasto pesante, dieci minuti di passi.","La domenica, una camminata nella natura."]},{"S":["Piano B: se salta l'attività, fai venti minuti di camminata svelta.","Alterna giorni intensi e giorni leggeri: il corpo cresce nel recupero.","Tieni un registro semplice: cosa hai fatto, come ti sei sentito.","Trova un
